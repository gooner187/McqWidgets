<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Base reset (the artifact viewer normally supplies this) */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>River Crossing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one landscape scene, positioned in the artwork's own 1597×985 coordinates and scaled to fit. Single dark surround so the artwork reads as the only colour on the page. */
:root {
  --surround: #1d2830;
  --surround-edge: #2c3a44;
  --ink: #dfe7ec;
  --ink-soft: #93a6b2;
  --focus: #ffd34d;
  --foot-shadow: #1b1a19;   /* matches the solid shadows in the artwork */
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-game: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  /* Results card: picks up the lever's red and the river's blues */
  --card: #ffffff;
  --card-ink: #1d2830;
  --card-soft: #5c6f7b;
  --card-edge: #1d2830;
  --star: #ffc531;
  --star-edge: #b9800a;
  --star-off: #d5dee3;
  --button: #e3263c;
  --button-ink: #ffffff;
  /* Start screen, after Andy's design */
  --intro-blue: #1414e0;
  --intro-gold: #ffcf2e;
  --intro-yellow: #ffe600;
  --intro-title: #1630d8;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--surround);
  color: var(--ink);
  font-family: var(--font-ui);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  touch-action: manipulation;
}
.stage {
  position: relative;
  width: min(100%, calc((100vh - 64px) * 1597 / 985));
  width: min(100%, calc((100dvh - 64px) * 1597 / 985));
  max-width: 100%;
  aspect-ratio: 1597 / 985;
  overflow: hidden;
  border-radius: 6px;
  box-shadow: 0 0 0 1px var(--surround-edge);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  container-type: inline-size;
}
.stage img { max-width: none; display: block; pointer-events: none; -webkit-user-drag: none; }
.layer { position: absolute; }
.bg { inset: 0; width: 100%; height: 100%; }

/* Characters: a shadow at the feet, the sprite above it. Taps are matched to the drawn
   character (not its rectangle) by the stage's own handler, so the buttons ignore the pointer;
   they stay focusable so the keyboard can still operate them. */
.char {
  position: absolute;
  padding: 0; margin: 0; border: 0; background: none;
  pointer-events: none;
  border-radius: 8px;
}
.char:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
.char .sprite { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 100%; }
.char .shadow {
  /* Solid ellipse centred on the soles: about a third of the character's height wide, a tenth high.
     --sx (centre), --sw (width) and --sy (lift) are set per character, as percentages of the sprite box. */
  position: absolute;
  left: calc(var(--sx, 50%) - var(--sw, 70%) / 2);
  width: var(--sw, 70%);
  bottom: calc(-5% + var(--sy, 0%));
  height: 10%;
  border-radius: 50%;
  background: var(--foot-shadow);
}
.char[hidden] { display: none !important; }
.lever { transform-origin: 50% 100%; transition: transform 90ms ease-out; }
.lever.pressed { transform: translateY(3%) scaleY(0.93); }
.wake { pointer-events: none; }
.lever-key { position: absolute; padding: 0; border: 0; background: none; pointer-events: none; border-radius: 6px; }
.lever-key:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.fx { pointer-events: none; }

/* Rule-break show: a see-through bubble with a green stage, over the middle of the scene. */
.rb { position: absolute; inset: 0; z-index: 2800; pointer-events: none; }
.rb[hidden] { display: none !important; }
.rb-bubble {
  position: absolute; border-radius: 50%; overflow: hidden;
  background: rgb(245 245 200 / .8);
}
.rb-disc { position: absolute; border-radius: 50%; background: rgb(93 178 115 / .94); }
.rb-actor { position: absolute; transform-origin: 50% 100%; }
.rb-actor img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; transform-origin: 50% 100%; }
.rb-actor .rb-shadow {
  position: absolute; left: calc(var(--sx, 50%) - var(--sw, 70%) / 2); width: var(--sw, 70%);
  bottom: -5%; height: 10%; border-radius: 50%; background: var(--foot-shadow);
}
.rb-hand { position: absolute; transform-origin: 50% 92%; }
.rb-mark {
  position: absolute; font-family: var(--font-game); font-weight: 700; color: #e3263c;
  font-size: 4.2cqw; line-height: 1; text-shadow: 0 .2cqw 0 #1d2830; transform-origin: 50% 100%;
}
.rb-puff { position: absolute; border-radius: 50%; background: rgb(214 205 186 / .9); }
.rb-star { position: absolute; }
.rb-ladder { position: absolute; transform-origin: 50% 0; }
.rb-shout { position: absolute; transform-origin: 0 100%; }
.rb-waves { position: absolute; transform-origin: 0 50%; }

/* Celebrations: only the drawing moves; the shadow stays on the ground and shrinks. */
:root:not(.no-motion) .char.bounce .sprite { animation: bounce 640ms ease-in-out infinite; animation-delay: var(--delay, 0s); }
:root:not(.no-motion) .char.hop .sprite { animation: hop 460ms ease-out; }
:root:not(.no-motion) .char.hop .shadow { animation: shadow-hop 460ms ease-out; }
:root:not(.no-motion) .char.big-hop .sprite { animation: big-hop 700ms cubic-bezier(.3,.7,.4,1); }
:root:not(.no-motion) .char.big-hop .shadow { animation: shadow-hop 700ms ease-out; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5%); } }
@keyframes hop {
    0% { transform: translateY(0) scaleY(1); } 14% { transform: translateY(0) scaleY(.9); }
    50% { transform: translateY(-16%) scaleY(1.03); } 86% { transform: translateY(0) scaleY(.94); } 100% { transform: none; }
  }
@keyframes big-hop {
    0% { transform: translateY(0) scaleY(1); } 14% { transform: translateY(0) scaleY(.86); }
    48% { transform: translateY(-30%) scaleY(1.05); } 84% { transform: translateY(0) scaleY(.92); } 100% { transform: none; }
  }
@keyframes shadow-hop { 0%, 100% { transform: scale(1); } 50% { transform: scale(.6); opacity: .7; } }

/* Results card: sits on the empty near bank once everyone is across. Sizes follow the stage width. */
.result {
  position: absolute;
  left: 3.5%; bottom: 4%;
  width: max(34%, 270px);
  max-height: 92%;
  z-index: 3000;
  box-sizing: border-box;
  padding: 1.4cqw 1.8cqw 1.6cqw;
  background: var(--card);
  color: var(--card-ink);
  border: max(2px, .22cqw) solid var(--card-edge);
  border-radius: 1.4cqw;
  box-shadow: 0 .5cqw 0 rgb(29 40 48 / .35);
  font-family: var(--lang-font, var(--font-game));
  font-size: max(10.5px, 1.45cqw);
  line-height: 1.25;
  display: grid;
  gap: .7cqw;
  justify-items: center;
  text-align: center;
}
.result[hidden] { display: none !important; }
.result h2 { margin: 0; font-size: 1.75em; font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
.stars { display: flex; gap: .6cqw; }
.stars svg { width: 4.4cqw; height: 4.4cqw; min-width: 26px; min-height: 26px; overflow: visible; }
.stars polygon { fill: var(--star-off); stroke: var(--star-off); stroke-width: 5; stroke-linejoin: round; }
.stars .earned polygon { fill: var(--star); stroke: var(--star-edge); }
.stars svg { transform: scale(0); }
.stars svg.shown { transform: scale(1); }
:root:not(.no-motion) .result:not([hidden]) { animation: card-in 420ms cubic-bezier(.2,.9,.3,1.2); }
@keyframes card-in { from { transform: translateY(14%) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
:root:not(.no-motion) .stars svg.shown { animation: star-pop 420ms cubic-bezier(.3,1.6,.5,1); }
@keyframes star-pop { 0% { transform: scale(0) rotate(-25deg); } 100% { transform: scale(1) rotate(0); } }
.scores { margin: 0; display: grid; grid-template-columns: auto auto; gap: .25cqw 1.4cqw; align-items: baseline; }
.scores dt { font-weight: 600; text-align: end; }
.scores dd { margin: 0; text-align: start; font-variant-numeric: tabular-nums; }
.scores b { font-size: 1.3em; font-weight: 700; }
.scores span { color: var(--card-soft); font-size: .85em; margin-left: .4em; }
.result .hint { margin: 0; color: var(--card-soft); font-size: .9em; }
.restart {
  font: inherit; font-weight: 700; font-size: 1.15em;
  color: var(--button-ink); background: var(--button);
  border: max(2px, .2cqw) solid var(--card-edge);
  border-radius: 999px;
  padding: .4em 1.6em;
  min-height: 36px;
  cursor: pointer;
  box-shadow: 0 .3cqw 0 var(--card-edge);
}
.restart:hover { filter: brightness(1.08); }
.restart:active { transform: translateY(.2cqw); box-shadow: 0 .1cqw 0 var(--card-edge); }
.restart:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* Start screen: the scene washed out behind a title, the story and three buttons (after Andy's design). */
.intro {
  position: absolute; inset: 0; z-index: 4000;
  background: rgb(255 255 255 / .62);
  font-family: var(--lang-font, var(--font-game));
  transition: opacity 380ms ease;
}
.intro[hidden] { display: none !important; }
.intro.leaving { opacity: 0; }
.intro-title {
  position: absolute; left: 5.5%; top: 3%; width: 68%; height: 11%;
  margin: 0; display: flex; align-items: center;
  font-size: 5.4cqw; font-weight: 700; line-height: 1.1; letter-spacing: .01em;
  color: var(--intro-title);
  white-space: nowrap; overflow: hidden;
  text-shadow: 0 0 .25cqw #fff, .2cqw .2cqw 0 #fff, -.2cqw .2cqw 0 #fff, .2cqw -.2cqw 0 #fff, -.2cqw -.2cqw 0 #fff;
}
.intro-story {
  position: absolute; left: 5.5%; right: 4.5%; top: 15.5%; height: 50%;
  margin: 0; overflow: hidden;
  font-size: 4.2cqw; font-weight: 600; line-height: 1.28;
  color: #111;
  text-wrap: pretty;
  text-shadow:
    .22cqw 0 0 #fff, -.22cqw 0 0 #fff, 0 .22cqw 0 #fff, 0 -.22cqw 0 #fff,
    .16cqw .16cqw 0 #fff, -.16cqw .16cqw 0 #fff, .16cqw -.16cqw 0 #fff, -.16cqw -.16cqw 0 #fff;
}
.intro[lang="ur"] .intro-story { line-height: 2.05; }
.intro[lang="ur"] .intro-title { line-height: 1.9; }
.intro-btn {
  position: absolute; left: 59.5%; width: 13.8%; height: 8.2%;
  display: flex; align-items: center; justify-content: center;
  padding: 0 1.4%; box-sizing: border-box;
  font: inherit; font-size: 2.3cqw; font-weight: 600; line-height: 1; color: #fff;
  background: linear-gradient(90deg, var(--intro-gold) 0 7%, var(--intro-blue) 7% 93%, var(--intro-gold) 93%);
  border: max(2px, .2cqw) solid #111;
  cursor: pointer;
  white-space: nowrap; overflow: hidden;
}
.intro-btn.how { top: 70%; }
.intro-btn.credits { top: 83.5%; }
.intro-btn:hover { filter: brightness(1.12); }
.intro-btn:active { transform: translateY(.15cqw); }
.intro-start {
  position: absolute; left: 76.75%; top: 67.4%; width: 15.5%; aspect-ratio: 1;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  padding: 0 1%; box-sizing: border-box;
  font: inherit; font-size: 4.3cqw; font-weight: 700; line-height: 1; color: var(--intro-yellow);
  background: var(--intro-blue);
  border: max(2px, .3cqw) solid #111;
  box-shadow: inset 0 0 0 .35cqw #fff, inset 0 0 0 .6cqw #111;
  cursor: pointer;
  text-align: center;
  white-space: nowrap; overflow: hidden;
}
.intro-start:hover { filter: brightness(1.12); }
.intro-start:active { transform: scale(.97); }
:root:not(.no-motion) .intro-start { animation: start-pulse 1.8s ease-in-out infinite; }
@keyframes start-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.intro-btn:focus-visible, .intro-start:focus-visible, .lang-toggle:focus-visible, .lang-menu button:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 3px;
}

/* Language picker */
.lang-toggle {
  position: absolute; right: 2.4%; top: 3.6%;
  display: flex; align-items: center; gap: .5em;
  font: inherit; font-size: max(12px, 1.5cqw); font-weight: 600; color: var(--card-ink);
  background: #fff; border: max(2px, .18cqw) solid #111; border-radius: 999px;
  padding: .35em .9em .35em .6em; cursor: pointer;
  font-family: var(--font-ui);
}
.lang-toggle svg { width: 1.25em; height: 1.25em; flex: none; }
.lang-menu {
  position: absolute; right: 2.4%; top: 11.5%; z-index: 2;
  max-height: 84%; overflow: auto;
  display: grid; grid-template-columns: repeat(3, auto); gap: .2em;
  padding: .5em; margin: 0; list-style: none;
  background: #fff; border: max(2px, .18cqw) solid #111; border-radius: 1cqw;
  box-shadow: 0 .4cqw 0 rgb(29 40 48 / .3);
  font-size: max(12px, 1.45cqw);
  font-family: var(--font-ui);
}
.lang-menu[hidden] { display: none !important; }
.lang-menu button {
  width: 100%; text-align: start; font: inherit; color: var(--card-ink);
  background: none; border: 0; border-radius: .5em; padding: .4em .7em; cursor: pointer; white-space: nowrap;
}
.lang-menu button:hover { background: #e9f1f5; }
.lang-menu button[aria-current="true"] { background: var(--intro-blue); color: #fff; }
.motion-toggle {
  position: absolute; right: 2.4%; top: 11%;
  display: flex; align-items: center; gap: .55em;
  font: inherit; font-size: max(12px, 1.5cqw); font-weight: 600; color: var(--card-ink);
  font-family: var(--lang-font, var(--font-ui));
  background: #fff; border: max(2px, .18cqw) solid #111; border-radius: 999px;
  padding: .3em .45em .3em .85em; cursor: pointer;
}
.motion-toggle .track {
  position: relative; width: 2.3em; height: 1.3em; border-radius: 999px;
  background: #a7b3ba; transition: background 150ms;
  flex: none;
}
.motion-toggle .knob {
  position: absolute; top: .15em; left: .15em; width: 1em; height: 1em; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .25); transition: transform 150ms;
}
.motion-toggle[aria-checked="true"] .track { background: #27a845; }
.motion-toggle[aria-checked="true"] .knob { transform: translateX(1em); }
[dir="rtl"] .motion-toggle[aria-checked="true"] .knob { transform: translateX(-1em); }
[dir="rtl"] .motion-toggle .knob { left: auto; right: .15em; }
.motion-toggle:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* Credits: a black panel in a white frame; one name at a time, each in its own place. */
.credits-panel {
  position: absolute; inset: 2.2% 1.8%; z-index: 5;
  background: #000;
  border: max(3px, .75cqw) solid #fff; border-radius: 1.6cqw;
  box-shadow: 0 0 0 max(1px, .15cqw) #111;
  overflow: hidden;
}
.credits-panel[hidden] { display: none !important; }
.credit {
  position: absolute; color: #fff; opacity: 0;
  transition: opacity 450ms ease;
}
.credit.on { opacity: 1; }
.credit-name {
  display: block;
  font-family: "Anton", Impact, "Arial Narrow Bold", sans-serif; font-weight: 400;
  font-size: 6.4cqw; line-height: 1; letter-spacing: .01em;
  direction: ltr;
}
.credit-role {
  position: absolute; white-space: nowrap;
  font-family: var(--lang-font, var(--font-game)); font-weight: 600;
  font-size: 2.4cqw; line-height: 1;
}
/* Positions follow Andy's four credit screens */
.credit.c1 { left: 9%; top: 19%; }
.credit.c1 .credit-role { left: 28%; bottom: 100%; margin-bottom: .2em; }
.credit.c2 { left: 61%; top: 23%; }
.credit.c2 .credit-role { right: 100%; bottom: .2em; margin-right: .3em; }
.credit.c3 { left: 15%; top: 68%; }
.credit.c3 .credit-role { left: 70%; bottom: 100%; margin-bottom: .1em; }
.credit.c4 { left: 70%; top: 76%; }
.credit.c4 .credit-role { left: 22%; bottom: 100%; margin-bottom: .1em; }
.credits-close {
  position: absolute; right: 2%; top: 3.5%;
  display: flex; flex-direction: column; align-items: center; gap: .25em;
  padding: .3em; background: none; border: 0; cursor: pointer;
  font-family: var(--lang-font, var(--font-game)); font-weight: 600;
  font-size: 2.4cqw; color: #fff; line-height: 1;
}
.credits-close svg { width: 5.8cqw; height: 5.8cqw; min-width: 32px; min-height: 32px; }
.credits-close:hover svg { filter: brightness(1.15); }
.credits-close:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: .5em; }
:root.no-motion .credit { transition: none; }

/* How to play: pale yellow sheet, blue headings, red raft rules, green warnings (after Andy's screen). */
.help-panel {
  position: absolute; inset: 2.2% 1.8%; z-index: 5;
  background: #ffff99;
  border: max(3px, .75cqw) solid #fff; border-radius: 1.6cqw;
  box-shadow: 0 0 0 max(1px, .15cqw) #111;
  overflow: hidden;
}
.help-panel[hidden] { display: none !important; }
.help-text {
  position: absolute; left: 3%; top: 3.5%; width: 77%; bottom: 3.5%;
  overflow: hidden;
  font-family: var(--lang-font, var(--font-game)); font-weight: 500;
  font-size: 2.4cqw; line-height: 1.35; color: #111;
}
.help-text p, .help-text ol { margin: 0 0 .7em; }
.help-text ol { padding: 0; list-style: none; counter-reset: step; }
.help-text li { counter-increment: step; }
.help-text li::before { content: counter(step) ") "; }
.h-blue { color: #1010e0; }
.h-red { color: #e3121b; }
.h-green { color: #0d8a1d; }
.help-text .sp::after { content: " "; }
.help-panel[lang="zh-Hant"] .sp::after, .help-panel[lang="zh-Hans"] .sp::after, .help-panel[lang="ja"] .sp::after { content: none; }
.help-close { right: 2%; top: auto; bottom: 4%; color: #111; font-size: 2.6cqw; white-space: nowrap; }
.help-close svg { width: 7cqw; height: 7cqw; }

/* Phones held upright: ask for landscape. */
.rotate {
  display: none;
  position: fixed; inset: 0; z-index: 1000;
  background: var(--surround);
  color: var(--ink);
  flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px));
  text-align: center;
  font-size: 18px;
}
.rotate svg { width: 72px; height: 72px; }
@media (orientation: portrait) and (max-width: 700px) {
  .rotate { display: flex; }
}
:root:not(.no-motion) .rotate svg { animation: tilt 2.4s ease-in-out infinite; }
@keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
</style>
</head>
<body>
<div class="stage" id="stage" aria-label="River crossing scene">
  <img class="layer bg" src="assets/background.jpg" alt="">
  <div class="result" id="result" role="dialog" aria-labelledby="result-title" hidden>
    <h2 id="result-title" data-t="complete">Puzzle complete!</h2>
    <div class="stars" id="stars" role="img" aria-label="">
      <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 61,38 96,38 68,58 79,92 50,71 21,92 32,58 4,38 39,38"></polygon></svg>
      <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 61,38 96,38 68,58 79,92 50,71 21,92 32,58 4,38 39,38"></polygon></svg>
      <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 61,38 96,38 68,58 79,92 50,71 21,92 32,58 4,38 39,38"></polygon></svg>
    </div>
    <dl class="scores">
      <dt data-t="moves">Moves</dt><dd><b id="r-moves">0</b><span id="r-moves-best">best possible 17</span></dd>
      <dt data-t="breaks">Rule-breaks</dt><dd><b id="r-breaks">0</b><span id="r-breaks-best">best possible 0</span></dd>
    </dl>
    <p class="hint" data-t="celebrate">Tap anyone to celebrate</p>
    <button class="restart" id="restart" type="button" data-t="restart">Restart</button>
  </div>
  <div class="rb" id="rb" hidden aria-hidden="true"></div>
  <div class="intro" id="intro" role="dialog" aria-labelledby="intro-title">
    <h1 class="intro-title" id="intro-title" data-t="title">過河遊戲</h1>
    <p class="intro-story" id="intro-story" data-t="story"></p>
    <button class="intro-btn how" id="btn-how" type="button" data-t="how">How to play</button>
    <button class="intro-btn credits" id="btn-credits" type="button" data-t="credits">Credits</button>
    <button class="intro-start" id="btn-start" type="button" data-t="start">Start</button>
    <button class="lang-toggle" id="lang-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="lang-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3.2 3 15.8 0 19M12 2.5c-3 3.2-3 15.8 0 19"/></svg>

    <ul class="lang-menu" id="lang-menu" hidden></ul>
    <div class="help-panel" id="help" role="dialog" aria-labelledby="btn-how" hidden>

        <p><span class="h-blue sp" data-t="hMissionLabel"></span><span data-t="hMission"></span></p>
        <p><span class="sp" data-t="hIntro"></span><span class="h-red sp" data-t="hSteer"></span><span class="h-red sp" data-t="hTwo"></span><span data-t="hWarn"></span></p>
        <ol class="h-green"><li data-t="hS1"></li><li data-t="hS2"></li><li data-t="hS3"></li></ol>
        <p class="h-blue" data-t="hHowLabel"></p>
        <ol><li data-t="hTwo"></li><li data-t="hSteer"></li><li data-t="hH3"></li><li data-t="hH4"></li><li data-t="hH5"></li></ol>
      </div>
      <button class="credits-close help-close" id="help-close" type="button">
        <span data-t="close">Close</span>
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#0a0af0"/><path d="M12.5 12.5 L27.5 27.5 M27.5 12.5 L12.5 27.5" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="credits-panel" id="credits" role="dialog" aria-labelledby="btn-credits" hidden>
      <div class="credit c1"><span class="credit-role" data-t="roleArt">Art design</span><span class="credit-name">Raymond</span></div>
      <div class="credit c2"><span class="credit-role" data-t="roleEditor">Editor</span><span class="credit-name">Kitman</span></div>
      <div class="credit c3"><span class="credit-role" data-t="rolePlanning">Planning</span><span class="credit-name">Kenny</span></div>
      <div class="credit c4"><span class="credit-role" data-t="roleProgramming">Programming</span><span class="credit-name">Fred</span></div>
      <button class="credits-close" id="credits-close" type="button">
        <span data-t="close">Close</span>
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#0a0af0"/><path d="M12.5 12.5 L27.5 27.5 M27.5 12.5 L12.5 27.5" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="rotate" role="dialog" aria-label="Rotate your phone">
  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true">
    <rect x="20" y="6" width="24" height="52" rx="4"></rect>
    <line x1="28" y1="51" x2="36" y2="51"></line>
  </svg>
  <p style="margin:0" data-t="rotate">Turn your phone sideways to play</p>
</div>

<script>
(() => {
  // All positions are in the background's own pixels (1597 × 985).
  const STAGE = { w: 1597, h: 985 };

  const PROPS = {
    raft:      { src: "assets/raft.png",      x: 396,    y: 351,   w: 494,  h: 474,   z: 760 },
    post:      { src: "assets/post-near.png", x: 676,    y: 768,   w: 64,   h: 84,    z: 846 },
    leverNear: { src: "assets/lever.png",     x: 845.5,  y: 755.9, w: 77.6, h: 133.9, z: 868 },
    leverFar:  { src: "assets/lever.png",     x: 1332.9, y: 375.5, w: 65.4, h: 112.9, z: 470 }
  };

  // Where the raft sits on the far side, relative to its near-side mooring (approved).
  const DOCK = { dx: 398, dy: -233 };
  const RAFT_Z = { near: 760, far: 200 };   // in front of near-bank props; behind the far-bank group

  // Raft seats on the near side: feet position, and size relative to the character's bank size.
  // Each character's raftShift (scene pixels) fine-tunes these to match the artwork.
  // The same seats move with the raft to the far side.
  const RAFT_SEATS = [
    { x: 622.3, y: 694.0, scale: 0.977 },  // back left (first to board)
    { x: 718.7, y: 719.0, scale: 0.977 }   // front right
    // Both spots sit 8 px further apart (along the line between them) than in the reference artwork.
  ];

  // Each character has two poses:
  //  near: turned to face the far bank (used on the start bank and when boarding there)
  //  far:  front-facing (used on the far bank and when boarding there), drawn smaller
  // sprite, aspect (width/height), anchor (body centre across the image, 0-1),
  // spot (feet x, y and height on that bank). far.raftH overrides the size on the raft.
  const CHARACTERS = {
    FT: { name: "Female Teacher",
      near: { sprite: "assets/ft-turned.png", aspect: 0.4493, anchor: 0.532, x: 91.9, y: 662, h: 270,
              shadowShift: { x: -18, y: -8 }, raftShift: { x: 0, y: 3 } },
      far:  { sprite: "assets/ft-front.png", aspect: 0.4222, anchor: 0.456, x: 1272.1, y: 231.3, h: 216.6 } },
    G1: { name: "Female Student 1",
      near: { sprite: "assets/g1-turned.png", aspect: 0.5402, anchor: 0.58, x: 241, y: 710, h: 186, raftShift: { x: -1, y: -3.5 } },
      far:  { sprite: "assets/g1-front.png", aspect: 0.6094, anchor: 0.319, x: 1179.8, y: 302.7, h: 169.4 } },
    G2: { name: "Female Student 2",
      near: { sprite: "assets/g2-turned.png", aspect: 0.445, anchor: 0.445, x: 342, y: 755, h: 186, raftShift: { x: -15, y: -3.5 } },
      far:  { sprite: "assets/g2-front.png", aspect: 0.4538, anchor: 0.429, x: 1098.8, y: 359.5, h: 174.2 } },
    MT: { name: "Male Teacher",
      near: { sprite: "assets/mt-turned.png", aspect: 0.3925, anchor: 0.479, x: 477, y: 813, h: 296, raftShift: { x: 1, y: 15 } },
      far:  { sprite: "assets/mt-front.png", aspect: 0.3811, anchor: 0.501, x: 1388.5, y: 274.9, h: 234.7 } },
    B1: { name: "Male Student 1",
      near: { sprite: "assets/b1-turned.png", aspect: 0.4883, anchor: 0.452, x: 600, y: 848, h: 200, raftShift: { x: -8, y: 5 } },
      far:  { sprite: "assets/b1-front.png", aspect: 0.54, anchor: 0.555, x: 1319.9, y: 341.4, h: 162.1 } },
    B2: { name: "Male Student 2",
      near: { sprite: "assets/b2-left.png", aspect: 0.5286, anchor: 0.44, x: 730, y: 896, h: 191, raftShift: { x: -8, y: 5 } },
      far:  { sprite: "assets/b2-right.png", aspect: 0.546, anchor: 0.476, x: 1224.4, y: 398.3, h: 152.4 } },
    P: { name: "Police Officer",
      near: { sprite: "assets/p-left.png", aspect: 0.4451, anchor: 0.407, x: 155, y: 888, h: 264, raftShift: { x: 0, y: 3 } },
      far:  { sprite: "assets/p-right.png", aspect: 0.4424, anchor: 0.549, x: 1509.7, y: 322.1, h: 222.6,
              raftH: 198, raftShift: { x: 4, y: -1 } } },
    R: { name: "Prisoner",
      near: { sprite: "assets/r-right.png", aspect: 0.4504, anchor: 0.457, x: 274, y: 929, h: 197, raftShift: { x: 0, y: 0 } },
      far:  { sprite: "assets/r-left.png", aspect: 0.4715, anchor: 0.402, x: 1436.0, y: 378.9, h: 168.2,
              raftH: 167, raftShift: { x: 0, y: -10 } } }
  };

  const OPERATORS = ["P", "MT", "FT"];
  const SHADOW_WIDTH = 0.35;   // shadow width as a fraction of the character's height
  // Animations play by default, whatever the device's own setting (school PCs often turn effects off).
  // Students can switch them off on the start screen; the choice is remembered in this browser.
  let reduceMotion = false;
  try { reduceMotion = localStorage.getItem("river-motion") === "off"; } catch (err) {}
  document.documentElement.classList.toggle("no-motion", reduceMotion);
  const crossTime = () => window.__riverCrossMs || (reduceMotion ? 600 : 1500);   // __riverCrossMs: testing only
  let CROSS_MS = crossTime();

  const state = {
    raftSide: "near",
    raft: [null, null],               // character ids in the back and front seats
    where: {},                        // "near" | "far" | "raft"
    moves: 0,
    ruleBreaks: 0,
    busy: false,                      // true while the raft is crossing
    complete: false,                  // everyone is on the far bank
    started: false                    // the start screen has been dismissed
  };
  for (const id of Object.keys(CHARACTERS)) state.where[id] = "near";

  const stage = document.getElementById("stage");
  const pct = (v, total) => (v / total * 100) + "%";

  function placeBox(el, x, y, w, h, z) {
    el.style.left = pct(x, STAGE.w);
    el.style.top = pct(y, STAGE.h);
    el.style.width = pct(w, STAGE.w);
    el.style.height = pct(h, STAGE.h);
    el.style.zIndex = Math.round(z);
  }

  // ---- Props ----
  const propEls = {};
  for (const [id, p] of Object.entries(PROPS)) {
    const img = document.createElement("img");
    img.className = "layer" + (id.startsWith("lever") ? " lever" : "");
    img.id = id;
    img.src = p.src;
    img.alt = "";
    placeBox(img, p.x, p.y, p.w, p.h, p.z);
    stage.appendChild(img);
    propEls[id] = img;
  }

  // Wake: drawn on its own canvas just behind the raft.
  const wake = document.createElement("canvas");
  wake.className = "layer wake";
  wake.style.left = "0"; wake.style.top = "0"; wake.style.width = "100%"; wake.style.height = "100%";
  stage.appendChild(wake);
  const wctx = wake.getContext("2d");
  function sizeWake() {
    const r = stage.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    wake.width = Math.max(1, Math.round(r.width * dpr));
    wake.height = Math.max(1, Math.round(r.height * dpr));
  }
  sizeWake();
  window.addEventListener("resize", sizeWake);

  // ---- Characters: one button each; sprite swaps between poses ----
  const els = {}, sprites = {};
  for (const [id, c] of Object.entries(CHARACTERS)) {
    const b = document.createElement("button");
    b.className = "char";
    b.type = "button";
    b.setAttribute("aria-label", c.name);
    b.innerHTML = '<span class="shadow"></span><img class="sprite" alt="" src="' + c.near.sprite + '">';
    b.addEventListener("click", () => tapCharacter(id));
    stage.appendChild(b);
    els[id] = b;
    sprites[id] = b.querySelector(".sprite");
  }

  // Where each character is drawn right now, in scene pixels, for tap matching.
  const boxes = {};

  function drawCharacter(id, pose, feetX, feetY, h, z) {
    const pz = CHARACTERS[id][pose];
    const el = els[id], img = sprites[id];
    if (img.getAttribute("src") !== pz.sprite) img.setAttribute("src", pz.sprite);
    const w = h * pz.aspect;
    const box = { x: feetX - w * pz.anchor, y: feetY - h, w, h, z: Math.round(z), sprite: pz.sprite };
    boxes[id] = box;
    const shift = pz.shadowShift || { x: 0, y: 0 };
    const k = h / pz.h;                 // shift is in scene pixels at bank size
    el.style.setProperty("--sx", (pz.anchor * 100 + shift.x * k / w * 100) + "%");
    el.style.setProperty("--sy", (-shift.y * k / h * 100) + "%");
    el.style.setProperty("--sw", (SHADOW_WIDTH / pz.aspect * 100) + "%");
    placeBox(el, box.x, box.y, box.w, box.h, box.z);
  }

  // The raft's offset from its near mooring: (0,0) at the near side, DOCK at the far side.
  function raftOffset(side) { return side === "far" ? { x: DOCK.dx, y: DOCK.dy } : { x: 0, y: 0 }; }

  function drawRaft(off, z, bob) {
    const p = PROPS.raft;
    placeBox(propEls.raft, p.x + off.x, p.y + off.y + bob, p.w, p.h, z);
  }

  // Passengers ride in the pose of the bank they boarded from.
  function drawPassengers(off, raftZ, bob, pose) {
    state.raft.forEach((id, i) => {
      if (!id) return;
      const c = CHARACTERS[id], pz = c[pose], seat = RAFT_SEATS[i];
      const rs = pz.raftShift || c.near.raftShift || { x: 0, y: 0 };
      const h = pz.raftH || pz.h * seat.scale;
      const fx = seat.x + rs.x + off.x, fy = seat.y + rs.y + off.y + bob;
      drawCharacter(id, pose, fx, fy, h, Math.max(raftZ, fy) + 1 + i);
    });
  }

  function render() {
    const side = state.raftSide, off = raftOffset(side), rz = RAFT_Z[side];
    drawRaft(off, rz, 0);
    for (const id of Object.keys(CHARACTERS)) {
      const where = state.where[id];
      els[id].hidden = false;
      if (where === "near" || where === "far") {
        const pz = CHARACTERS[id][where];
        drawCharacter(id, where, pz.x, pz.y, pz.h, pz.y);
      }
    }
    drawPassengers(off, rz, 0, side);
  }

  // ---- Loading and unloading ----
  function tapCharacter(id) {
    if (!state.started) return;
    if (state.complete) { waveAndJump(); return; }
    if (state.busy) return;
    const where = state.where[id];
    if (where === "raft") {
      // Changed their mind: step back onto the bank the raft is at.
      state.raft[state.raft.indexOf(id)] = null;
      state.where[id] = state.raftSide;
    } else if (where === state.raftSide) {
      const seat = state.raft.indexOf(null);
      if (seat === -1) return;          // raft full
      state.raft[seat] = id;
      state.where[id] = "raft";
    }
    render();
  }

  // ---- Rules (hidden from students) ----
  function bankIsSafe(group) {
    const has = id => group.includes(id);
    if (has("R") && !has("P") && group.some(id => id !== "R")) return false;
    if ((has("G1") || has("G2")) && has("MT") && !has("FT")) return false;
    if ((has("B1") || has("B2")) && has("FT") && !has("MT")) return false;
    return true;
  }

  function pullLever(which) {
    if (!state.started) return;
    pressLever(which);
    if (state.busy || state.complete) return;
    const aboard = state.raft.filter(Boolean);
    if (aboard.length === 0) return;                       // empty raft: nothing happens
    if (!aboard.some(id => OPERATORS.includes(id))) {      // nobody aboard can steer
      wontMove();
      return;
    }
    const from = state.raftSide, to = from === "near" ? "far" : "near";
    const ids = Object.keys(CHARACTERS);
    const leftBehind = ids.filter(id => state.where[id] === from);
    const arriving = ids.filter(id => state.where[id] === to).concat(aboard);
    if (!bankIsSafe(leftBehind) || !bankIsSafe(arriving)) {
      state.ruleBreaks++;
      ruleBreak(bankIsSafe(leftBehind) ? arriving : leftBehind);
      return;
    }
    cross(from, to);
  }

  // Placeholder until this animation is designed.
  function wontMove() {}

  function pressLever(which) {
    const el = propEls[which];
    el.classList.remove("pressed");
    void el.offsetWidth;
    el.classList.add("pressed");
    setTimeout(() => el.classList.remove("pressed"), 180);
  }

  // ---- The crossing ----
  const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * t);       // gentle start and stop
  const speedAt = t => Math.sin(Math.PI * t);                // 0 at each end, 1 mid-river

  function cross(from, to) {
    state.busy = true;
    const a = raftOffset(from), b = raftOffset(to);
    const za = RAFT_Z[from], zb = RAFT_Z[to];
    const dir = { x: b.x - a.x, y: b.y - a.y };
    const len = Math.hypot(dir.x, dir.y);
    const back = { x: -dir.x / len, y: -dir.y / len };
    const t0 = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - t0) / CROSS_MS);
      const e = ease(t);
      const off = { x: a.x + dir.x * e, y: a.y + dir.y * e };
      const bob = reduceMotion ? 0 : Math.sin((now - t0) / 1000 * Math.PI * 2 * 1.1) * 3 * speedAt(t);
      const rz = za + (zb - za) * e;
      drawRaft(off, rz, bob);
      drawPassengers(off, rz, bob, from);
      wake.style.zIndex = Math.round(rz) - 1;
      drawWake(off, back, from, speedAt(t), Math.min(1, e * len / 250), now, 1);
      if (t < 1) { requestAnimationFrame(frame); return; }
      arrive(to, off, back, from);
    }
    requestAnimationFrame(frame);
  }

  function arrive(side, off, back, from) {
    // Everyone on board steps off to their own spot on this bank.
    state.raft.forEach(id => { if (id) state.where[id] = side; });
    state.raft = [null, null];
    state.raftSide = side;
    state.moves++;
    render();
    if (Object.values(state.where).every(w => w === "far")) {
      state.complete = true;
      setTimeout(celebrate, 450);
    }
    // Let the wake settle away.
    const t0 = performance.now(), FADE = reduceMotion ? 1 : 700;
    function fade(now) {
      const f = Math.max(0, 1 - (now - t0) / FADE);
      drawWake(off, back, from, 0.35 * f, 1, now, f);
      if (f > 0) requestAnimationFrame(fade);
      else { wctx.clearRect(0, 0, wake.width, wake.height); state.busy = false; }
    }
    requestAnimationFrame(fade);
  }

  // Wake: pale aqua, sketchy streaks trailing behind the raft, redrawn often so it shimmers.
  // Rear edge of the logs in near-mooring coordinates, for each direction of travel.
  const REAR_EDGE = {
    near: [{ x: 452, y: 728 }, { x: 716, y: 820 }],   // heading to the far bank: lower-left logs
    far:  [{ x: 884, y: 722 }, { x: 700, y: 648 }]    // heading back: upper-right logs
  };

  function rng(seed) {                       // small repeatable random numbers
    let s = seed >>> 0;
    return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  // The river's outline, so the wake never spills onto the banks.
  const waterMask = new Image();
  waterMask.src = "assets/water-mask.png";

  function drawWake(off, back, from, speed, grown, now, alpha) {
    const k = wake.width / STAGE.w;
    wctx.setTransform(k, 0, 0, k, 0, 0);
    wctx.globalCompositeOperation = "source-over";
    wctx.clearRect(0, 0, STAGE.w, STAGE.h);
    if (alpha <= 0 || reduceMotion) return;
    const [e0, e1] = REAR_EDGE[from];
    const p0 = { x: e0.x + off.x, y: e0.y + off.y }, p1 = { x: e1.x + off.x, y: e1.y + off.y };
    const perp = { x: -back.y, y: back.x };
    const L = (70 + 250 * speed) * grown;
    const rand = rng(Math.floor(now / 110));                // new scribble every ~110 ms
    const strength = alpha * (0.4 + 0.6 * speed);
    const ink = a => "rgba(214, 240, 242, " + Math.max(0, Math.min(1, a)).toFixed(3) + ")";
    wctx.lineCap = "round";
    wctx.lineJoin = "round";

    // Wavy streaks leaving the rear logs and drifting apart.
    const N = 12;
    for (let i = 0; i < N; i++) {
      const u = i / (N - 1);
      const sx = p0.x + (p1.x - p0.x) * u + (rand() - 0.5) * 10;
      const sy = p0.y + (p1.y - p0.y) * u + (rand() - 0.5) * 10;
      const spread = (u - 0.5) * 0.7 + (rand() - 0.5) * 0.25;
      const dx = back.x * Math.cos(spread) - back.y * Math.sin(spread);
      const dy = back.x * Math.sin(spread) + back.y * Math.cos(spread);
      const len = L * (0.4 + 0.6 * rand());
      const phase = rand() * 6.28, amp = 5 + rand() * 9, freq = 2.5 + rand() * 3;
      wctx.lineWidth = 3.4;
      wctx.strokeStyle = ink(0.8 * strength);
      wctx.beginPath();
      const SEG = 14;
      for (let s = 0; s <= SEG; s++) {
        const f = s / SEG;
        const w = Math.sin(f * freq * Math.PI + phase) * amp * (0.3 + f);
        const x = sx + dx * len * f + perp.x * w, y = sy + dy * len * f + perp.y * w;
        if (s === 0) wctx.moveTo(x, y); else wctx.lineTo(x, y);
        if (s === Math.round(SEG * 0.6)) {           // thin out towards the tail
          wctx.stroke(); wctx.beginPath(); wctx.moveTo(x, y);
          wctx.lineWidth = 2.2; wctx.strokeStyle = ink(0.5 * strength);
        }
      }
      wctx.stroke();
    }

    // Loops and curls scattered through the wake, like the scribbles in the artwork.
    const ang = Math.atan2(back.y, back.x);
    for (let j = 0; j < 11; j++) {
      const u = rand();
      const d = L * (0.1 + 0.8 * rand());
      const cx = p0.x + (p1.x - p0.x) * u + back.x * d + perp.x * (rand() - 0.5) * 40;
      const cy = p0.y + (p1.y - p0.y) * u + back.y * d + perp.y * (rand() - 0.5) * 40;
      const r = 10 + 26 * rand();
      const start = rand() * 6.28, sweep = 3.2 + rand() * 2.4;
      wctx.lineWidth = 2.6;
      wctx.strokeStyle = ink(0.7 * strength * (1 - 0.6 * d / Math.max(L, 1)));
      wctx.beginPath();
      wctx.ellipse(cx, cy, r, r * (0.45 + 0.3 * rand()), ang + (rand() - 0.5) * 0.8, start, start + sweep);
      wctx.stroke();
    }

    // Keep it on the water.
    if (waterMask.complete && waterMask.naturalWidth) {
      wctx.globalCompositeOperation = "destination-in";
      wctx.drawImage(waterMask, 0, 0, STAGE.w, STAGE.h);
      wctx.globalCompositeOperation = "source-over";
    }
  }

  // ---- Tap matching: find the character or lever actually drawn under the finger or pointer ----
  // Each sprite's transparency is sampled once into a small grid; a tap counts when it lands
  // on a drawn pixel. If nothing is directly under it, points within TAP_SLOP are tried,
  // so slightly-off taps on a small figure still work.
  const MASK_W = 96;
  const TAP_SLOP = 14;               // scene pixels
  const masks = {};                  // by sprite file

  for (const c of Object.values(CHARACTERS)) {
    for (const pz of [c.near, c.far]) {
      if (pz.sprite in masks) continue;
      masks[pz.sprite] = undefined;
      const img = new Image();
      img.onload = () => {
        try {
          const w = MASK_W, h = Math.round(MASK_W / pz.aspect);
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          const ctx = cv.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(img, 0, 0, w, h);
          const data = ctx.getImageData(0, 0, w, h).data;
          const alpha = new Uint8Array(w * h);
          for (let i = 0; i < w * h; i++) alpha[i] = data[i * 4 + 3];
          masks[pz.sprite] = { w, h, alpha };
        } catch (err) {
          masks[pz.sprite] = null;     // unreadable: fall back to the rectangle
        }
      };
      img.src = pz.sprite;
    }
  }

  function drawnAt(id, sx, sy) {
    const b = boxes[id];
    if (!b || els[id].hidden) return false;
    const u = (sx - b.x) / b.w, v = (sy - b.y) / b.h;
    if (u < 0 || u >= 1 || v < 0 || v >= 1.05) return false;
    if (v >= 1) return true;         // the shadow strip just below the feet
    const m = masks[b.sprite];
    if (!m) return true;
    return m.alpha[Math.floor(v * m.h) * m.w + Math.floor(u * m.w)] > 40;
  }

  function characterAt(sx, sy) {
    const offsets = [[0, 0]];
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4;
      offsets.push([Math.cos(a) * TAP_SLOP / 2, Math.sin(a) * TAP_SLOP / 2], [Math.cos(a) * TAP_SLOP, Math.sin(a) * TAP_SLOP]);
    }
    const ids = Object.keys(CHARACTERS).sort((a, b) => (boxes[b]?.z ?? 0) - (boxes[a]?.z ?? 0));
    for (const [dx, dy] of offsets) {
      for (const id of ids) if (drawnAt(id, sx + dx, sy + dy)) return id;
    }
    return null;
  }

  // Levers: the knob and pole, with a generous margin.
  function leverAt(sx, sy) {
    for (const id of ["leverNear", "leverFar"]) {
      const p = PROPS[id], m = 14;
      const poleL = p.x + p.w * 0.15, poleR = p.x + p.w * 0.85;
      if (sx >= poleL - m && sx <= poleR + m && sy >= p.y - m && sy <= p.y + p.h + m) return id;
    }
    return null;
  }

  function scenePoint(e) {
    const r = stage.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * STAGE.w, (e.clientY - r.top) / r.height * STAGE.h];
  }

  stage.addEventListener("click", e => {
    const [sx, sy] = scenePoint(e);
    const lever = leverAt(sx, sy);
    if (lever) { pullLever(lever); return; }
    const id = characterAt(sx, sy);
    if (id) tapCharacter(id);
  });
  stage.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    const [sx, sy] = scenePoint(e);
    stage.style.cursor = (!state.busy && (leverAt(sx, sy) || characterAt(sx, sy))) ? "pointer" : "";
  });

  // Keyboard: the levers as buttons too.
  for (const id of ["leverNear", "leverFar"]) {
    const b = document.createElement("button");
    b.className = "lever-key";
    b.type = "button";
    b.setAttribute("aria-label", id === "leverNear" ? "Raft control, near bank" : "Raft control, far bank");
    const p = PROPS[id];
    placeBox(b, p.x, p.y, p.w, p.h, p.z + 1);
    b.addEventListener("click", e => { if (e.detail === 0) pullLever(id); });
    stage.appendChild(b);
  }

  // ---- Finishing: fireworks, the results card, and celebrations on tap ----
  const PARTY = ["#7a2fa8", "#d6338f", "#e3263c", "#ffc531", "#2bb3c0", "#6fb9e8", "#6fae3e", "#ffffff"];
  const OUTFITS = ["#8b8a3e", "#a9cfe3", "#1f3b5c", "#8a2a14", "#6e8b4c", "#e9e3d0", "#2f5f9e", "#111111", "#ffc531", "#e3263c"];

  function makeCanvas(z) {
    const c = document.createElement("canvas");
    c.className = "layer fx";
    c.style.left = "0"; c.style.top = "0"; c.style.width = "100%"; c.style.height = "100%";
    c.style.zIndex = z;
    stage.appendChild(c);
    return c;
  }
  const skyCanvas = makeCanvas(150);       // fireworks: behind the far-bank group
  const frontCanvas = makeCanvas(2500);    // confetti: in front of everything but the card
  const skyCtx = skyCanvas.getContext("2d"), frontCtx = frontCanvas.getContext("2d");
  function sizeFx() {
    const r = stage.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of [skyCanvas, frontCanvas]) {
      c.width = Math.max(1, Math.round(r.width * dpr));
      c.height = Math.max(1, Math.round(r.height * dpr));
    }
  }
  sizeFx();
  window.addEventListener("resize", sizeFx);

  const fx = { rockets: [], sparks: [], confetti: [], until: 0, nextLaunch: 0, last: 0, running: false };

  function runFx() {
    if (fx.running) return;
    fx.running = true;
    fx.last = performance.now();
    requestAnimationFrame(fxFrame);
  }

  function launchRocket() {
    const x = 120 + Math.random() * 1360;
    fx.rockets.push({ x, y: 330, tx: x + (Math.random() - 0.5) * 80, ty: 40 + Math.random() * 120,
                      t: 0, dur: 0.6 + Math.random() * 0.3, colour: PARTY[Math.floor(Math.random() * PARTY.length)] });
  }

  function burst(x, y, colour) {
    const n = 46 + Math.floor(Math.random() * 20), second = PARTY[Math.floor(Math.random() * PARTY.length)];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.2, sp = 110 + Math.random() * 170;
      fx.sparks.push({ x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                       life: 1.1 + Math.random() * 0.6, age: 0, colour: i % 3 ? colour : second });
    }
  }

  function dropConfetti(count) {
    for (let i = 0; i < count; i++) {
      fx.confetti.push({ x: Math.random() * STAGE.w, y: -20 - Math.random() * 380,
                         vy: 150 + Math.random() * 120, sway: Math.random() * 6.28, swaySpeed: 2 + Math.random() * 3,
                         rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 10,
                         w: 9 + Math.random() * 7, h: 5 + Math.random() * 4,
                         colour: OUTFITS[Math.floor(Math.random() * OUTFITS.length)] });
    }
    runFx();
  }

  function fxFrame(now) {
    const dt = Math.min(0.05, (now - fx.last) / 1000);
    fx.last = now;
    if (now < fx.until && now >= fx.nextLaunch) {
      launchRocket();
      if (Math.random() < 0.35) launchRocket();
      fx.nextLaunch = now + 380 + Math.random() * 420;
    }
    const k = skyCanvas.width / STAGE.w;
    skyCtx.setTransform(k, 0, 0, k, 0, 0);
    skyCtx.clearRect(0, 0, STAGE.w, STAGE.h);
    skyCtx.lineCap = "round";
    for (const r of fx.rockets) {
      r.t += dt / r.dur;
      const e = 1 - Math.pow(1 - Math.min(1, r.t), 2);
      const x = r.x + (r.tx - r.x) * e, y = r.y + (r.ty - r.y) * e;
      skyCtx.strokeStyle = "rgba(255, 244, 214, 0.9)";
      skyCtx.lineWidth = 3;
      skyCtx.beginPath(); skyCtx.moveTo(x, y); skyCtx.lineTo(x - (r.tx - r.x) * 0.05, y + 22); skyCtx.stroke();
      if (r.t >= 1) { burst(r.tx, r.ty, r.colour); r.done = true; }
    }
    fx.rockets = fx.rockets.filter(r => !r.done);
    for (const p of fx.sparks) {
      p.age += dt;
      p.px = p.x; p.py = p.y;
      p.vy += 140 * dt; p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const f = 1 - p.age / p.life;
      if (f <= 0) continue;
      skyCtx.globalAlpha = f;
      skyCtx.strokeStyle = p.colour;
      skyCtx.lineWidth = 4;
      skyCtx.beginPath(); skyCtx.moveTo(p.px - (p.x - p.px) * 2, p.py - (p.y - p.py) * 2); skyCtx.lineTo(p.x, p.y); skyCtx.stroke();
    }
    skyCtx.globalAlpha = 1;
    fx.sparks = fx.sparks.filter(p => p.age < p.life);

    const kf = frontCanvas.width / STAGE.w;
    frontCtx.setTransform(kf, 0, 0, kf, 0, 0);
    frontCtx.clearRect(0, 0, STAGE.w, STAGE.h);
    for (const c of fx.confetti) {
      c.y += c.vy * dt; c.sway += c.swaySpeed * dt; c.rot += c.spin * dt;
      const x = c.x + Math.sin(c.sway) * 18;
      frontCtx.save();
      frontCtx.translate(x, c.y);
      frontCtx.rotate(c.rot);
      frontCtx.scale(1, Math.abs(Math.cos(c.rot * 0.7)) * 0.8 + 0.2);
      frontCtx.fillStyle = c.colour;
      frontCtx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      frontCtx.restore();
    }
    fx.confetti = fx.confetti.filter(c => c.y < STAGE.h + 30);

    if (now < fx.until || fx.rockets.length || fx.sparks.length || fx.confetti.length) {
      requestAnimationFrame(fxFrame);
    } else {
      fx.running = false;
      skyCtx.clearRect(0, 0, STAGE.w, STAGE.h);
      frontCtx.clearRect(0, 0, STAGE.w, STAGE.h);
    }
  }

  const FIREWORKS_MS = 7000;
  let bounceTimer = 0;

  function celebrate() {
    if (!state.complete) return;
    if (!reduceMotion) {
      fx.until = performance.now() + FIREWORKS_MS;
      fx.nextLaunch = 0;
      runFx();
      for (const el of Object.values(els)) {
        el.style.setProperty("--delay", (Math.random() * -0.64).toFixed(2) + "s");
        el.classList.add("bounce");
      }
      clearTimeout(bounceTimer);
      bounceTimer = setTimeout(stopBouncing, FIREWORKS_MS);
    }
    setTimeout(showResults, reduceMotion ? 0 : 1100);
  }

  function stopBouncing() {
    for (const el of Object.values(els)) el.classList.remove("bounce");
  }

  // Tap anyone after finishing: a wave from left to right, then everyone jumps as confetti falls.
  let waving = false;
  function waveAndJump() {
    if (waving) return;
    waving = true;
    stopBouncing();
    const ids = Object.keys(CHARACTERS).sort((a, b) => boxes[a].x - boxes[b].x);
    const STEP = reduceMotion ? 0 : 120;
    const hop = (el, cls, ms) => {
      el.classList.remove("hop", "big-hop");
      void el.offsetWidth;
      el.classList.add(cls);
      setTimeout(() => el.classList.remove(cls), ms);
    };
    ids.forEach((id, i) => setTimeout(() => hop(els[id], "hop", 480), i * STEP));
    const together = ids.length * STEP + 380;
    setTimeout(() => {
      ids.forEach(id => hop(els[id], "big-hop", 720));
      if (!reduceMotion) dropConfetti(160);
    }, together);
    setTimeout(() => { waving = false; }, together + 800);
  }

  const result = document.getElementById("result");
  const starEls = [...document.querySelectorAll("#stars svg")];

  function showResults() {
    if (!state.complete) return;
    const earned = [true, state.moves <= 17, state.ruleBreaks === 0];
    document.getElementById("r-moves").textContent = state.moves;
    document.getElementById("r-breaks").textContent = state.ruleBreaks;
    const count = earned.filter(Boolean).length;
    document.getElementById("stars").setAttribute("aria-label", count + "/3 ★");
    starEls.forEach(svg => svg.classList.remove("shown", "earned"));
    result.hidden = false;
    starEls.forEach((svg, i) => {
      if (earned[i]) svg.classList.add("earned");
      setTimeout(() => svg.classList.add("shown"), reduceMotion ? 0 : 450 + i * 380);
    });
  }

  function restart() {
    state.raftSide = "near";
    state.raft = [null, null];
    for (const id of Object.keys(CHARACTERS)) state.where[id] = "near";
    state.moves = 0;
    state.ruleBreaks = 0;
    state.complete = false;
    state.busy = false;
    result.hidden = true;
    fx.until = 0; fx.rockets = []; fx.sparks = []; fx.confetti = [];
    clearTimeout(bounceTimer);
    for (const el of Object.values(els)) el.classList.remove("bounce", "hop", "big-hop");
    render();
  }
  document.getElementById("restart").addEventListener("click", restart);
  result.addEventListener("click", e => e.stopPropagation());   // taps on the card stay on the card

  // ---- Rule-break show ----
  // A finger waggles "no", then the people who broke a rule act out what went wrong, inside a bubble.
  // The real scene is untouched underneath: when the bubble fades, everyone is exactly where they were.
  const RB = {
    bubble: { cx: 818, cy: 498, r: 440 },
    disc:   { cx: 815, cy: 642, w: 716, h: 292 }
  };
  const rbLayer = document.getElementById("rb");
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const anim = (el, frames, opts) => el.animate(frames, Object.assign({ fill: "forwards" }, opts)).finished;

  // Which story to tell, from the group on the bank that broke a rule. The prisoner is checked first.
  function pickStory(group) {
    const has = id => group.includes(id);
    if (has("R") && !has("P") && group.some(id => id !== "R")) {
      // Left with a teacher: a rope ladder lifts the prisoner away. Only pupils: the prisoner runs for it.
      const teachers = group.filter(id => id === "FT" || id === "MT");
      const pupils = group.filter(id => ["G1", "G2", "B1", "B2"].includes(id));
      if (teachers.length) return { kind: "ladder", cast: ["R", ...teachers, ...pupils].slice(0, 3) };
      return { kind: "escape", cast: ["R", ...pupils.slice(0, 2)] };
    }
    if ((has("B1") || has("B2")) && has("FT") && !has("MT")) {
      return { kind: "throw", cast: ["FT", ...["B1", "B2"].filter(has)] };
    }
    if (has("G1")) return { kind: "spin", cast: ["MT", "G1"] };
    return { kind: "shrink", cast: ["MT", "G2"] };
  }

  // Place an element in scene pixels, relative to the bubble's box.
  function inBubble(el, x, y, w, h) {
    const b = RB.bubble, size = b.r * 2, left = b.cx - b.r, top = b.cy - b.r;
    el.style.left = ((x - left) / size * 100) + "%";
    el.style.top = ((y - top) / size * 100) + "%";
    el.style.width = (w / size * 100) + "%";
    el.style.height = (h / size * 100) + "%";
  }

  // A character standing in the bubble at their start-bank size. pose: "near" (turned) or "far" (front-facing).
  function actor(parent, id, pose, fx, fy, mirror) {
    const pz = CHARACTERS[id][pose], h = CHARACTERS[id].near.h, w = h * pz.aspect;
    const anchor = mirror ? 1 - pz.anchor : pz.anchor;
    const wrap = document.createElement("div");
    wrap.className = "rb-actor";
    wrap.innerHTML = '<span class="rb-shadow"></span><img alt="" src="' + pz.sprite + '">';
    wrap.style.setProperty("--sx", (anchor * 100) + "%");
    wrap.style.setProperty("--sw", (SHADOW_WIDTH / pz.aspect * 100) + "%");
    if (mirror) wrap.querySelector("img").style.transform = "scaleX(-1)";
    inBubble(wrap, fx - w * anchor, fy - h, w, h);
    parent.appendChild(wrap);
    return { id, wrap, img: wrap.querySelector("img"), shadow: wrap.querySelector(".rb-shadow"), w, h, fx, fy };
  }

  // The waggling finger, drawn in the puzzle's flat cartoon style.
  // Palm side, index finger raised at the edge, other fingers curled in and the thumb across them (with its thumbnail).
  const HAND_SVG =
    '<svg viewBox="0 0 120 200" width="100%" height="100%" aria-hidden="true">' +
      '<rect x="34" y="166" width="58" height="32" rx="9" fill="#7fb3d1"/>' +
      '<rect x="34" y="166" width="58" height="8" rx="4" fill="#5f93b3"/>' +
      '<rect x="24" y="12" width="25" height="104" rx="12.5" fill="#f6c48f" transform="rotate(8 36 116)"/>' +
      '<rect x="22" y="86" width="80" height="88" rx="30" fill="#f6c48f"/>' +
      '<rect x="47" y="90" width="19" height="76" rx="9.5" fill="#efb781"/>' +
      '<rect x="65" y="95" width="19" height="70" rx="9.5" fill="#f2bd87"/>' +
      '<rect x="83" y="102" width="17" height="60" rx="8.5" fill="#efb781"/>' +
      '<path d="M65.5 104 v54 M83.5 110 v46" stroke="#d99a62" stroke-width="3" stroke-linecap="round"/>' +
      '<path d="M30 150 C 40 132, 58 124, 80 122" stroke="#e9ac74" stroke-width="22" stroke-linecap="round" fill="none"/>' +
      '<path d="M30 150 C 40 132, 58 124, 80 122" stroke="#f6c48f" stroke-width="16" stroke-linecap="round" fill="none"/>' +
      '<path d="M36 98 q4 10 2 22" stroke="#e1a56c" stroke-width="3" stroke-linecap="round" fill="none"/>' +
      '<ellipse cx="74" cy="122" rx="7" ry="5" transform="rotate(-12 74 122)" fill="#fde3c4" stroke="#e9ac74" stroke-width="1.5"/>' +
    '</svg>';

  function makeHand(parent, x, y, w, h) {
    const d = document.createElement("div");
    d.className = "rb-hand";
    d.innerHTML = HAND_SVG;
    inBubble(d, x - w / 2, y - h, w, h);
    parent.appendChild(d);
    return d;
  }

  async function waggle(hand, times, ms) {
    const frames = [{ transform: "rotate(0deg)" }];
    for (let i = 0; i < times; i++) frames.push({ transform: "rotate(-18deg)" }, { transform: "rotate(18deg)" });
    frames.push({ transform: "rotate(0deg)" });
    await anim(hand, frames, { duration: ms, easing: "ease-in-out" });
  }

  const pop = (el, ms = 260) => anim(el, [{ transform: "scale(0)", opacity: 0 }, { transform: "scale(1.08)", opacity: 1, offset: .7 }, { transform: "scale(1)", opacity: 1 }], { duration: ms, easing: "ease-out" });
  const walk = (a, dx, ms) => anim(a.wrap, [
    { transform: "translate(0, 0)" },
    { transform: `translate(${dx * 0.25 / a.w * 100}%, -3%)` }, { transform: `translate(${dx * 0.5 / a.w * 100}%, 0)` },
    { transform: `translate(${dx * 0.75 / a.w * 100}%, -3%)` }, { transform: `translate(${dx / a.w * 100}%, 0)` }
  ], { duration: ms, easing: "linear" });

  // A jagged shout burst and sound waves, in the same flat style.
  const SHOUT_SVG =
    '<svg viewBox="0 0 120 100" width="100%" height="100%" aria-hidden="true">' +
      '<polygon points="60,4 70,26 96,10 86,36 116,40 88,56 106,82 78,72 70,96 56,74 34,94 36,68 6,72 26,52 2,32 32,32 22,8 46,24" fill="#ffffff" stroke="#1d2830" stroke-width="5" stroke-linejoin="round"/>' +
      '<text x="60" y="64" text-anchor="middle" font-family="Fredoka, Trebuchet MS, sans-serif" font-weight="700" font-size="34" fill="#e3263c">!!</text>' +
    '</svg>';
  const WAVES_SVG =
    '<svg viewBox="0 0 60 60" width="100%" height="100%" aria-hidden="true">' +
      '<path d="M8 18 Q16 30 8 42 M22 10 Q34 30 22 50 M36 2 Q52 30 36 58" stroke="#1d2830" stroke-width="5" fill="none" stroke-linecap="round"/>' +
    '</svg>';

  // Female Teacher with the brown-haired boy: she shouts at him and he shrinks until he disappears.
  async function shoutAt(stage, ft, kid, from) {
    const dx = kid.fx - 165 - ft.fx;
    await anim(ft.wrap, [{ transform: `translate(${from / ft.w * 100}%, 0)` }, { transform: `translate(${dx / ft.w * 100}%, 0)` }], { duration: 380, easing: "ease-in-out" });
    const mouthX = ft.fx + dx + 42, mouthY = ft.fy - ft.h * 0.72;
    ft.img.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(7deg)" }], { duration: 160, fill: "forwards" });
    const burst = document.createElement("div");
    burst.className = "rb-shout";
    burst.innerHTML = SHOUT_SVG;
    inBubble(burst, mouthX + 14, mouthY - 150, 132, 110);
    stage.appendChild(burst);
    pop(burst, 200);
    const sizes = [0.68, 0.38, 0];
    let prev = 1;
    for (const sz of sizes) {
      const w = document.createElement("div");
      w.className = "rb-waves";
      w.innerHTML = WAVES_SVG;
      inBubble(w, mouthX + 4, mouthY - 36, 72, 72);
      stage.appendChild(w);
      w.animate([{ transform: "translateX(0) scale(.7)", opacity: 1 }, { transform: "translateX(150%) scale(1.15)", opacity: 0 }], { duration: 460, fill: "forwards" });
      burst.animate([{ transform: "scale(1)" }, { transform: "scale(1.12) rotate(-4deg)" }, { transform: "scale(1)" }], { duration: 300 });
      kid.shadow.animate([{ transform: `scale(${prev})` }, { transform: `scale(${sz})` }], { duration: 420, fill: "forwards" });
      await anim(kid.img, [{ transform: `scale(${prev})`, opacity: 1 }, { transform: `scale(${sz})`, opacity: sz ? 1 : 0 }], { duration: 420, easing: "ease-in" });
      prev = sz;
    }
    await anim(burst, [{ transform: "scale(1)", opacity: 1 }, { transform: "scale(0)", opacity: 0 }], { duration: 180 });
    ft.img.animate([{ transform: "rotate(7deg)" }, { transform: "rotate(0deg)" }], { duration: 200, fill: "forwards" });
    return dx;
  }

  // Female Teacher with a boy: the green-haired boy is thrown into the air; the brown-haired boy is shouted away.
  async function storyThrow(stage, cast) {
    const ft = actor(stage, "FT", "near", 755, 680);
    const spots = [[871, 626], [985, 668]];
    const kids = cast.slice(1).map((id, i) => actor(stage, id, "far", spots[i][0], spots[i][1]));
    await Promise.all([ft.wrap, ...kids.map(k => k.wrap)].map(el => pop(el)));
    await wait(250);
    let at = 0;
    for (const kid of kids) {
      if (kid.id === "B2") { at = await shoutAt(stage, ft, kid, at); continue; }
      const dx = kid.fx - 95 - ft.fx;
      await anim(ft.wrap, [{ transform: `translate(${at / ft.w * 100}%, 0)` }, { transform: `translate(${dx / ft.w * 100}%, 0)` }], { duration: 420, easing: "ease-in-out" });
      at = dx;
      await anim(kid.img, [{ transform: "scaleY(1)" }, { transform: "scaleY(.85)" }], { duration: 120 });
      kid.shadow.animate([{ transform: "scale(1)", opacity: 1 }, { transform: "scale(.2)", opacity: 0 }], { duration: 700, fill: "forwards" });
      anim(ft.img, [{ transform: "translateY(0)" }, { transform: "translateY(-5%)" }, { transform: "translateY(0)" }], { duration: 300 });
      await anim(kid.img, [{ transform: "translate(0, 0) rotate(0deg) scaleY(.85)" }, { transform: "translate(15%, -420%) rotate(560deg) scaleY(1)" }], { duration: 760, easing: "cubic-bezier(.3,.6,.6,1)" });
    }
    await wait(250);
  }

  // Male Teacher with Female Student 1: she spins him like a top until he's dizzy and flops over.
  async function storySpin(stage) {
    const mt = actor(stage, "MT", "far", 880, 668);
    const g1 = actor(stage, "G1", "near", 720, 690);
    await Promise.all([pop(mt.wrap), pop(g1.wrap)]);
    await wait(200);
    await walk(g1, 70, 300);
    // Faster and faster: each half-turn is shorter than the last.
    const flips = [];
    let t = 0;
    const durs = [180, 150, 125, 105, 90, 80, 72, 66, 62, 60, 60, 60];
    const total = durs.reduce((a, b) => a + b, 0);
    durs.forEach((d, i) => { t += d; flips.push({ transform: `scaleX(${i % 2 ? 1 : -1})`, offset: t / total }); });
    flips.unshift({ transform: "scaleX(1)", offset: 0 });
    flips[flips.length - 1].transform = "scaleX(1)";
    anim(g1.wrap, [{ transform: `translate(${70 / g1.w * 100}%, 0)` }, { transform: `translate(${70 / g1.w * 100}%, -8%)` }, { transform: `translate(${70 / g1.w * 100}%, 0)` }], { duration: 300, iterations: 3 });
    await anim(mt.img, flips, { duration: total, easing: "linear" });
    // Wobble with stars circling his head.
    const stars = [];
    for (let i = 0; i < 3; i++) {
      const st = document.createElement("div");
      st.className = "rb-star";
      st.innerHTML = '<svg viewBox="0 0 100 100" width="100%" height="100%"><polygon points="50,6 61,38 96,38 68,58 79,92 50,71 21,92 32,58 4,38 39,38" fill="#ffc531" stroke="#b9800a" stroke-width="6" stroke-linejoin="round"/></svg>';
      inBubble(st, mt.fx - 14, mt.fy - mt.h - 10, 28, 28);
      stage.appendChild(st);
      const orbit = [];
      for (let k = 0; k <= 12; k++) {
        const a = (k / 12) * Math.PI * 2 + i * 2.09;
        orbit.push({ transform: `translate(${Math.cos(a) * 180}%, ${Math.sin(a) * 50}%)`, opacity: 1 });
      }
      st.animate(orbit, { duration: 620, iterations: 2 });
      stars.push(st);
    }
    await anim(mt.wrap, [
      { transform: "rotate(0deg)" }, { transform: "rotate(-9deg)" }, { transform: "rotate(8deg)" },
      { transform: "rotate(-7deg)" }, { transform: "rotate(6deg)" }, { transform: "rotate(0deg)" }
    ], { duration: 820, easing: "ease-in-out" });
    stars.forEach(s => s.remove());
    // Flop.
    await anim(mt.wrap, [{ transform: "rotate(0deg)" }, { transform: "rotate(84deg) translateY(4%)" }], { duration: 320, easing: "cubic-bezier(.6,0,.9,.6)" });
    await wait(320);
  }

  // Male Teacher with Female Student 2: she stamps and wags her finger; he shrinks and scurries away.
  async function storyShrink(stage) {
    const mt = actor(stage, "MT", "far", 760, 690);
    const g2 = actor(stage, "G2", "far", 900, 660);
    await Promise.all([pop(mt.wrap), pop(g2.wrap)]);
    await wait(200);
    const little = makeHand(stage, g2.fx - 48, g2.fy - g2.h * 0.45, 44, 74);
    pop(little, 200);
    const sizes = [0.78, 0.56, 0.38];

      anim(g2.img, [{ transform: "translateY(0) scaleY(1)" }, { transform: "translateY(0) scaleY(.88)" }, { transform: "translateY(0) scaleY(1)" }], { duration: 220 });
      waggle(little, 1, 380);
      await anim(mt.wrap, [{ transform: `scale(${prev})` }, { transform: `scale(${sz})` }], { duration: 380, easing: "ease-out" });

    }

    await anim(mt.wrap, [

      { transform: `translate(-360%, -4%) scale(${prev})` }, { transform: `translate(-520%, 0) scale(${prev})` }
    ], { duration: 650, easing: "ease-in" });

  // Prisoner without the Police Officer: a startled "!" and the prisoner makes a run for it.
  async function storyEscape(stage, cast) {
    const spots = [[700, 690], [810, 640]];
    const others = cast.slice(1).map((id, i) => actor(stage, id, "far", spots[i][0], spots[i][1]));
    const r = actor(stage, "R", "near", 930, 680);
    await Promise.all([r.wrap, ...others.map(o => o.wrap)].map(el => pop(el)));
    await wait(250);
    await exclaim(stage, others);
    await anim(r.img, [{ transform: "scaleY(1)" }, { transform: "scaleY(.88)" }], { duration: 160 });
    for (let i = 0; i < 6; i++) {
      setTimeout(() => {

        puff.className = "rb-puff";

  // A rope ladder, in the same flat style: two ropes and wooden rungs.
  const LADDER = { w: 70, h: 760, rungY: 740 };
  function ladderSvg() {
    let rungs = "";
    for (let y = LADDER.rungY; y > 0; y -= 46) rungs += '<rect x="6" y="' + (y - 4) + '" width="58" height="8" rx="3" fill="#b98a4e"/>';
    return '<svg viewBox="0 0 70 760" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="M12 0 V' + (LADDER.rungY + 6) + ' M58 0 V' + (LADDER.rungY + 6) + '" stroke="#8a6a3e" stroke-width="5" stroke-linecap="round"/>' +
      rungs + '</svg>';
  }

  function exclaim(stage, people) {
    return Promise.all(people.map(o => {
      const m = document.createElement("div");
      m.className = "rb-mark";
      m.textContent = "!";
      inBubble(m, o.fx - 12, o.fy - o.h - 70, 24, 60);
      stage.appendChild(m);
      return pop(m, 240);
    }));
  }

  // Prisoner left with a teacher: a rope ladder drops in, the prisoner steps on, and is lifted away.
  async function storyLadder(stage, cast) {
    const spots = [[700, 690], [815, 650]];
    const others = cast.slice(1).map((id, i) => actor(stage, id, "far", spots[i][0], spots[i][1]));
    const r = actor(stage, "R", "near", 900, 682);
    await Promise.all([r.wrap, ...others.map(o => o.wrap)].map(el => pop(el)));
    await wait(200);
    await exclaim(stage, others);
    // The ladder drops from above the bubble, its bottom rung level with the prisoner's feet.
    const lx = 1030, rung = r.fy + 2;
    const ladder = document.createElement("div");
    ladder.className = "rb-ladder";
    ladder.innerHTML = ladderSvg();
    inBubble(ladder, lx - LADDER.w / 2, rung - LADDER.rungY, LADDER.w, LADDER.h);
    stage.insertBefore(ladder, r.wrap);          // the prisoner stands in front of the ladder
    await anim(ladder, [
      { transform: "translateY(-100%)" }, { transform: "translateY(2%)", offset: .75 },
      { transform: "translateY(-1%)", offset: .9 }, { transform: "translateY(0)" }
    ], { duration: 560, easing: "ease-out" });
    ladder.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(1.5deg)" }, { transform: "rotate(-1.5deg)" }, { transform: "rotate(0deg)" }],
                   { duration: 900, iterations: Infinity });
    // Walk over and step onto the bottom rung.
    await walk(r, lx - r.fx, 420);
    const at = (lx - r.fx) / r.w * 100;
    await anim(r.wrap, [
      { transform: `translate(${at}%, 0)` }, { transform: `translate(${at}%, -6%)`, offset: .5 }, { transform: `translate(${at}%, -1.5%)` }
    ], { duration: 260, easing: "ease-out" });
    r.shadow.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: "forwards" });
    await wait(160);
    // Up and away, together.
    const rise = 900;
    await Promise.all([
      anim(ladder, [{ transform: "translateY(0)" }, { transform: `translateY(${-rise / LADDER.h * 100}%)` }], { duration: 1000, easing: "cubic-bezier(.5,0,.8,.6)" }),
      anim(r.wrap, [{ transform: `translate(${at}%, -1.5%)` }, { transform: `translate(${at}%, ${-1.5 - rise / r.h * 100}%)` }], { duration: 1000, easing: "cubic-bezier(.5,0,.8,.6)" })
    ]);
    await wait(300);
  }

    rbLayer.appendChild(bubble);
    const disc = document.createElement("div");

    try {
      await anim(bubble, [{ transform: "scale(.6)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: reduceMotion ? 1 : 280, easing: "cubic-bezier(.2,.9,.3,1.15)" });
      const hand = makeHand(bubble, b.cx, 380, 165, 275);
      await pop(hand, reduceMotion ? 1 : 220);
      if (reduceMotion) await wait(700); else await waggle(hand, 3, 950);
      await anim(hand, [{ transform: "scale(1)", opacity: 1 }, { transform: "scale(0)", opacity: 0 }], { duration: reduceMotion ? 1 : 180 });
      hand.remove();
      if (reduceMotion) {
        // Just show who was involved, without the slapstick.
        const ids = story.cast;
        ids.forEach((id, i) => actor(bubble, id, i === 0 && story.kind !== "spin" && story.kind !== "shrink" ? "near" : "far", 700 + i * 130, 680 - (i % 2) * 40));
        await wait(1400);
      } else if (story.kind === "throw") await storyThrow(bubble, story.cast);
      else if (story.kind === "spin") await storySpin(bubble);
      else if (story.kind === "shrink") await storyShrink(bubble);
      else if (story.kind === "ladder") await storyLadder(bubble, story.cast);
      else await storyEscape(bubble, story.cast);
      await anim(bubble, [{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(.96)" }], { duration: reduceMotion ? 1 : 320 });
    } finally {
      rbLayer.hidden = true;
      rbLayer.innerHTML = "";
      state.busy = false;
    }
  }
