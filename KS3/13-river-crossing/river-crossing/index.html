 "font": null, "family": "Fredoka", "t": {"title": "Cruzar el río", "story": "Dos profesores llevaron a cuatro alumnos de excursión con el colegio, pero se perdieron. Y lo que es peor, ¡se toparon con un preso fugado! Por suerte, un policía fuera de servicio que paseaba cerca atrapó al preso. Pero aquí no hay cobertura, así que nadie puede pedir ayuda. Ahora todos tienen que cruzar el río en una pequeña balsa.", "how": "Cómo jugar", "credits": "Créditos", "start": "Empezar", "complete": "¡Puzzle completado!", "moves": "Movimientos", "breaks": "Reglas rotas", "best": "mejor posible", "celebrate": "Toca a cualquiera para celebrarlo", "restart": "Reiniciar", "rotate": "Gira el móvil en horizontal para jugar", "language": "Idioma", "roleArt": "Diseño artístico", "roleEditor": "Edición", "rolePlanning": "Planificación", "roleProgramming": "Programación", "close": "Cerrar", "hMissionLabel": "Tu misión:", "hMission": "Ayuda a todos a salir sanos y salvos de esta colina antes de que anochezca.", "hIntro": "La única salida es cruzar el río. En la orilla hay una pequeña balsa que puede llevarlos al otro lado.", "hSteer": "Solo los dos profesores y el policía pueden manejar la balsa.", "hTwo": "Sean adultos o niños, la balsa solo lleva a dos personas en cada viaje.", "hWarn": "Mientras cruzan, debes evitar que pasen estas tres cosas:", "hS1": "Si el preso se queda con alguien sin el policía, se escapará.", "hS2": "Si el profesor se queda con las niñas sin la profesora, habrá problemas.", "hS3": "Si la profesora se queda con los niños sin el profesor, habrá problemas.", "hHowLabel": "Cómo jugar:", "hH3": "Toca a las personas que quieras subir a la balsa.", "hH4": "Después toca una palanca roja para enviar la balsa al otro lado.", "hH5": "Si al pulsar la palanca ocurre una de las tres situaciones anteriores, por ejemplo el profesor se queda con una niña, has elegido mal. La balsa no se moverá, así que vuelve a elegir.", "motion": "Animaciones"}}, {"code": "fr", "name": "Français", "dir": "ltr", "font": null, "family": "Fredoka", "t": {"title": "La traversée de la rivière", "story": "Deux enseignants ont emmené quatre élèves en randonnée scolaire, mais ils se sont perdus. Pire encore, ils sont tombés sur un prisonnier évadé ! Heureusement, un policier qui n'était pas en service et qui randonnait non loin a arrêté le prisonnier. Mais ici, il n'y a pas de réseau, alors personne ne peut appeler à l'aide. Maintenant, tout le monde doit traverser la rivière sur un petit radeau.", "how": "Comment jouer", "credits": "Crédits", "start": "Commencer", "complete": "Énigme résolue !", "moves": "Coups", "breaks": "Règles enfreintes", "best": "meilleur possible", "celebrate": "Touche n'importe qui pour fêter ça", "restart": "Recommencer", "rotate": "Tourne ton téléphone à l’horizontale pour jouer", "language": "Langue", "roleArt": "Direction artistique", "roleEditor": "Rédaction", "rolePlanning": "Conception", "roleProgramming": "Programmation", "close": "Fermer", "hMissionLabel": "Ta mission :", "hMission": "Aide tout le monde à quitter cette colline en sécurité avant la nuit.", "hIntro": "La seule issue est de traverser la rivière. Sur la rive, il y a un petit radeau qui peut les emmener de l’autre côté.", "hSteer": "Seuls les deux enseignants et le policier peuvent diriger le radeau.", "hTwo": "Adultes ou enfants, le radeau ne peut transporter que deux personnes à chaque traversée.", "hWarn": "Pendant la traversée, tu dois empêcher ces trois choses :", "hS1": "Si le prisonnier reste avec quelqu’un sans le policier, il s’enfuira.", "hS2": "Si l’enseignant reste avec les filles sans l’enseignante, il y aura des problèmes.", "hS3": "Si l’enseignante reste avec les garçons sans l’enseignant, il y aura des problèmes.", "hHowLabel": "Comment jouer :", "hH3": "Touche les personnes que tu veux faire monter sur le radeau.", "hH4": "Ensuite, touche un levier rouge pour envoyer le radeau de l’autre côté.", "hH5": "Si l’une des trois situations ci-dessus se produit quand tu appuies sur le levier, par exemple l’enseignant reste avec une fille, tu as fait le mauvais choix. Le radeau ne partira pas : choisis à nouveau.", "motion": "Animations"}}, {"code": "de", "name": "Deutsch", "dir": "ltr", "font": null, "family": "Fredoka", "t": {"title": "Die Flussüberquerung", "story": "Zwei Lehrkräfte machten mit vier Schülerinnen und Schülern eine Schulwanderung, doch sie verirrten sich. Schlimmer noch: Sie trafen auf einen entflohenen Häftling! Zum Glück fasste ein Polizist, der dienstfrei hatte und in der Nähe wanderte, den Häftling. Aber hier draußen gibt es keinen Handyempfang, also kann niemand Hilfe rufen. Jetzt müssen alle auf einem kleinen Floß über den Fluss.", "how": "Spielanleitung", "credits": "Mitwirkende", "start": "Start", "complete": "Rätsel gelöst!", "moves": "Züge", "breaks": "Regelverstöße", "best": "bestmöglich", "celebrate": "Tippe auf jemanden, um zu feiern", "restart": "Neustart", "rotate": "Drehe dein Handy quer, um zu spielen", "language": "Sprache", "roleArt": "Grafikdesign", "roleEditor": "Redaktion", "rolePlanning": "Konzept", "roleProgramming": "Programmierung", "close": "Schließen", "hMissionLabel": "Deine Aufgabe:", "hMission": "Hilf allen, diesen Hügel sicher zu verlassen, bevor es dunkel wird.", "hIntro": "Der einzige Weg hinaus führt über den Fluss. Am Ufer liegt ein kleines Floß, das sie ans andere Ufer bringen kann.", "hSteer": "Nur die beiden Lehrkräfte und der Polizist können das Floß steuern.", "hTwo": "Ob Erwachsene oder Kinder: Das Floß kann pro Fahrt nur zwei Personen tragen.", "hWarn": "Während der Überfahrt musst du verhindern, dass diese drei Dinge passieren:", "hS1": "Wenn der Häftling ohne den Polizisten mit jemandem zurückbleibt, flieht er.", "hS2": "Wenn der Lehrer ohne die Lehrerin mit den Mädchen zurückbleibt, gibt es Ärger.", "hS3": "Wenn die Lehrerin ohne den Lehrer mit den Jungen zurückbleibt, gibt es Ärger.", "hHowLabel": "Spielanleitung:", "hH3": "Tippe auf die Personen, die du auf das Floß setzen willst.", "hH4": "Tippe dann auf einen roten Hebel, um das Floß hinüberzuschicken.", "hH5": "Wenn beim Drücken des Hebels eine der drei Situationen oben eintritt, zum Beispiel der Lehrer mit einem Mädchen zurückbleibt, hast du die falschen Personen gewählt. Das Floß fährt nicht los, also wähle neu.", "motion": "Animationen"}}, {"code": "pt", "name": "Português", "dir": "ltr", "font": null, "family": "Fredoka", "t": {"title": "A travessia do rio", "story": "Dois professores levaram quatro alunos numa caminhada da escola, mas perderam-se. Pior ainda, encontraram um prisioneiro fugido! Felizmente, um polícia de folga que caminhava ali perto apanhou o prisioneiro. Mas aqui não há rede no telemóvel, por isso ninguém consegue pedir ajuda. Agora todos têm de atravessar o rio numa pequena jangada.", "how": "Como jogar", "credits": "Créditos", "start": "Começar", "complete": "Puzzle concluído!", "moves": "Jogadas", "breaks": "Regras quebradas", "best": "melhor possível", "celebrate": "Toca em qualquer pessoa para celebrar", "restart": "Recomeçar", "rotate": "Roda o telemóvel na horizontal para jogar", "language": "Idioma", "roleArt": "Design artístico", "roleEditor": "Edição", "rolePlanning": "Planeamento", "roleProgramming": "Programação", "close": "Fechar", "hMissionLabel": "A tua missão:", "hMission": "Ajuda todos a sair desta colina em segurança antes de anoitecer.", "hIntro": "A única saída é atravessar o rio. Na margem há uma pequena jangada que os pode levar para o outro lado.", "hSteer": "Só os dois professores e o polícia podem conduzir a jangada.", "hTwo": "Sejam adultos ou crianças, a jangada só leva duas pessoas de cada vez.", "hWarn": "Durante a travessia, tens de impedir que aconteçam estas três coisas:", "hS1": "Se o prisioneiro ficar com alguém sem o polícia, foge.", "hS2": "Se o professor ficar com as raparigas sem a professora, vai haver problemas.", "hS3": "Se a professora ficar com os rapazes sem o professor, vai haver problemas.", "hHowLabel": "Como jogar:", "hH3": "Toca nas pessoas que queres pôr na jangada.", "hH4": "Depois toca numa alavanca vermelha para enviar a jangada para o outro lado.", "hH5": "Se, ao carregares na alavanca, acontecer uma das três situações acima, por exemplo o professor ficar com uma rapariga, escolheste mal. A jangada não parte, por isso escolhe de novo.", "motion": "Animações"}}, {"code": "it", "name": "Italiano", "dir": "ltr", "font": null, "family": "Fredoka", "t": {"title": "La traversata del fiume", "story": "Due insegnanti hanno portato quattro alunni in gita scolastica a piedi, ma si sono persi. Peggio ancora, si sono imbattuti in un prigioniero evaso! Per fortuna, un poliziotto fuori servizio che camminava lì vicino ha catturato il prigioniero. Ma qui non c'è campo, quindi nessuno può chiamare aiuto. Ora tutti devono attraversare il fiume su una piccola zattera.", "how": "Come si gioca", "credits": "Riconoscimenti", "start": "Inizia", "complete": "Rompicapo risolto!", "moves": "Mosse", "breaks": "Regole infrante", "best": "migliore possibile", "celebrate": "Tocca chiunque per festeggiare", "restart": "Ricomincia", "rotate": "Ruota il telefono in orizzontale per giocare", "language": "Lingua", "roleArt": "Grafica", "roleEditor": "Redazione", "rolePlanning": "Ideazione", "roleProgramming": "Programmazione", "close": "Chiudi", "hMissionLabel": "La tua missione:", "hMission": "Aiuta tutti a lasciare questa collina sani e salvi prima che faccia buio.", "hIntro": "L'unica via d'uscita è attraversare il fiume. Sulla riva c'è una piccola zattera che può portarli dall'altra parte.", "hSteer": "Solo i due insegnanti e il poliziotto possono guidare la zattera.", "hTwo": "Adulti o bambini, la zattera può portare solo due persone per viaggio.", "hWarn": "Durante la traversata devi evitare che succedano queste tre cose:", "hS1": "Se il prigioniero resta con qualcuno senza il poliziotto, scapperà.", "hS2": "Se il professore resta con le ragazze senza la professoressa, ci saran     document.head.appendChild(link);
    return new Promise(res => { link.onload = res; link.onerror = res; setTimeout(res, 2500); })
      .then(() => document.fonts ? document.fonts.load('700 20px "' + l.family + '"').catch(() => {}) : null);
  }

  // Shrink text until it fits its box (stories differ in length between languages).
  function fit(el, startPx, minPx) {
    let size = startPx;
    el.style.fontSize = size + "px";
    while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && size > minPx) {
      size -= 0.5;
      el.style.fontSize = size + "px";
    }
  }
  function fitIntro() {
    if (intro.hidden) return;
    const w = stage.getBoundingClientRect().width;
    fit(titleEl, w * 0.054, 10);
    fit(storyEl, w * (lang === "ur" ? 0.036 : 0.044), 8);
    for (const b of intro.querySelectorAll(".intro-btn, .intro-start")) {
      fit(b, w * (b.classList.contains("intro-start") ? 0.043 : 0.023), 8);
    }
  }

  function setLanguage(code) {
    const l = byCode[code] || byCode.en;
    lang = l.code;
    document.documentElement.lang = l.code;
    document.documentElement.style.setProperty("--lang-font", fontStack(l));
    for (const el of document.querySelectorAll("[data-t]")) el.textContent = l.t[el.dataset.t];
    document.getElementById("r-moves-best").textContent = l.t.best + " 17";
    document.getElementById("r-breaks-best").textContent = l.t.best + " 0";
    for (const el of [intro, result, document.getElementById("help")]) { el.setAttribute("lang", l.code); el.dir = l.dir; }
    document.getElementById("lang-current").textContent = l.name;
    for (const b of langMenu.querySelectorAll("button")) b.setAttribute("aria-current", b.dataset.code === l.code ? "true" : "false");
    try { localStorage.setItem("river-lang", l.code); } catch (err) {}
    requestAnimationFrame(() => { fitIntro(); if (typeof fitHelp === "function") fitHelp(); });
    loadFont(l).then(() => { if (lang === l.code) { fitIntro(); if (typeof fitHelp === "function") fitHelp(); } });
  }

  for (const l of LANGS) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.code = l.code;
    b.lang = l.code;
    b.dir = l.dir;
    b.textContent = l.name;
    b.addEventListener("click", () => { setLanguage(l.code); closeMenu(); langToggle.focus(); });
    li.appendChild(b);
    langMenu.appendChild(li);
  }
  function closeMenu() { langMenu.hidden = true; langToggle.setAttribute("aria-expanded", "false"); }
  langToggle.addEventListener("click", () => {
    const open = langMenu.hidden;
    langMenu.hidden = !open;
    langToggle.setAttribute("aria-expanded", String(open));
    if (open) (langMenu.querySelector('[aria-current="true"]') || langMenu.querySelector("button")).focus();
  });
  intro.addEventListener("keydown", e => { if (e.key === "Escape" && !langMenu.hidden) { closeMenu(); langToggle.focus(); } });
  intro.addEventListener("click", e => {
    e.stopPropagation();                         // taps on the start screen never reach the game
    if (!langMenu.hidden && !langMenu.contains(e.target) && !langToggle.contains(e.target)) closeMenu();
  });

  // How to play: the mission, the raft rules and the controls. The close button returns to the start screen.
  const helpEl = document.getElementById("help");
  const helpBtn = document.getElementById("btn-how");
  function fitHelp() {
    if (helpEl.hidden) return;
    fit(document.getElementById("help-text"), stage.getBoundingClientRect().width * (lang === "ur" ? 0.021 : 0.024), 6);
  }
  function openHelp() {
    closeMenu();
    helpEl.hidden = false;
    requestAnimationFrame(fitHelp);
    document.getElementById("help-close").focus();
  }
  function closeHelp() { helpEl.hidden = true; helpBtn.focus(); }
  helpBtn.addEventListener("click", openHelp);
  document.getElementById("help-close").addEventListener("click", closeHelp);
  intro.addEventListener("keydown", e => { if (e.key === "Escape" && !helpEl.hidden) closeHelp(); });
  window.addEventListener("resize", () => requestAnimationFrame(fitHelp));

  // Credits: each name fades in on its own, in turn, on repeat, until closed.
  const creditsEl = document.getElementById("credits");
  const creditEls = [...creditsEl.querySelectorAll(".credit")];
  const creditsBtn = document.getElementById("btn-credits");
  let creditTimer = 0, creditIndex = 0;
  const CREDIT_SHOW = 2200;
  function nextCredit() {
    creditEls.forEach(el => el.classList.remove("on"));
    creditTimer = setTimeout(() => {
      creditEls[creditIndex].classList.add("on");
      creditIndex = (creditIndex + 1) % creditEls.length;
      creditTimer = setTimeout(nextCredit, CREDIT_SHOW);
    }, (reduceMotion ? 0 : 500));
  }
  function openCredits() {
    closeMenu();
    creditsEl.hidden = false;
    creditIndex = 0;
    clearTimeout(creditTimer);
    nextCredit();
    document.getElementById("credits-close").focus();
  }
  function closeCredits() {
    clearTimeout(creditTimer);
    creditEls.forEach(el => el.classList.remove("on"));
    creditsEl.hidden = true;
    creditsBtn.focus();
  }
  creditsBtn.addEventListener("click", openCredits);
  document.getElementById("credits-close").addEventListener("click", closeCredits);
  intro.addEventListener("keydown", e => { if (e.key === "Escape" && !creditsEl.hidden) closeCredits(); });

  document.getElementById("btn-start").addEventListener("click", () => {
    closeMenu();
    state.started = true;
    intro.classList.add("leaving");
    setTimeout(() => { intro.hidden = true; intro.classList.remove("leaving"); }, reduceMotion ? 0 : 380);
  });

  // Animations switch
  const motionToggle = document.getElementById("motion-toggle");
  function showMotion() { motionToggle.setAttribute("aria-checked", String(!reduceMotion)); }
  motionToggle.addEventListener("click", () => {
    closeMenu();
    reduceMotion = !reduceMotion;
    CROSS_MS = crossTime();
    document.documentElement.classList.toggle("no-motion", reduceMotion);
    try { localStorage.setItem("river-motion", reduceMotion ? "off" : "on"); } catch (err) {}
    showMotion();
  });
  showMotion();

  function startingLanguage() {
    try { const saved = localStorage.getItem("river-lang"); if (saved && byCode[saved]) return saved; } catch (err) {}
    return "zh-Hant";                            // Traditional Chinese is the default
  }
  window.addEventListener("resize", () => requestAnimationFrame(fitIntro));
  setLanguage(startingLanguage());

  window.__river = { state, pullLever, tapCharacter, restart, ruleBreak, setLanguage, CROSS_MS };   // for testing
  render();
})();
</script>
</body>
</html>
