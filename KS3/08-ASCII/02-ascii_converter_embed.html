<style>

  --dn:#AAB8FA;--hx:#FF9C90;--bn:#7FDB9E;--ch:#6FD3D9}

  --dn:#3A4F8A;--hx:#9A3B2A;--bn:#4A6A2E;--ch:#2F666B}
#gcs-conv[data-theme="ocean"]{--pageBg:#F3F6FB;--text:#182233;--secondary:#5C6B84;--cardBg:#FFFFFF;--cardBorder:#DCE4F0;--badgeBg:#EAF0FA;--badgeText:#5C6B84;--accent:#1D6FE0;--accentBg:#E9F1FE;--iconBg:#FFFFFF;--iconBorder:#DCE4F0;--iconColor:#182233;--correctBg:#E1F3EC;--correctText:#0F7A54;
  --dn:#1B4FA8;--hx:#B3261E;--bn:#1B7A3C;--ch:#0B6E75}
#gcs-conv[data-theme="forest"]{--pageBg:#F2F8F6;--text:#122420;--secondary:#4E6A61;--cardBg:#FFFFFF;--cardBorder:#D8EAE3;--badgeBg:#E6F3EE;--badgeText:#4E6A61;--accent:#0E8F72;--accentBg:#E4F5EF;--iconBg:#FFFFFF;--iconBorder:#D8EAE3;--iconColor:#122420;--correctBg:#DCEFE6;--correctText:#0A6B55;
  --dn:#1F3A93;--hx:#A8321E;--bn:#0A7D62;--ch:#0B5E66}
#gcs-conv[data-theme="plum"]{--pageBg:#F7F2FA;--text:#28183A;--secondary:#6F5C82;--cardBg:#FFFFFF;--cardBorder:#E7DAF0;--badgeBg:#F1E7F7;--badgeText:#6F5C82;--accent:#8034C2;--accentBg:#F1E6FA;--iconBg:#FFFFFF;--iconBorder:#E7DAF0;--iconColor:#28183A;--correctBg:#E7E0F2;--correctText:#5A3D7D;
  --dn:#5A2E9C;--hx:#B3261E;--bn:#1B7A3C;--ch:#0B6E75}
/* Text size: everything below is sized in em, so it all scales from this one setting */
#gcs-conv[data-fontsize="normal"]{font-size:16px}
#gcs-conv[data-fontsize="larger"]{font-size:18px}
#gcs-conv[data-fontsize="largest"]{font-size:20px}
#gcs-conv{container-type:inline-size;font-family:"DM Sans",system-ui,sans-serif;color:var(--text);background:var(--pageBg);max-width:680px;margin:0 auto;padding:20px;border-radius:18px;box-sizing:border-box;line-height:1.4}
#gcs-conv *{box-sizing:border-box}
#gcs-conv .head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:14px}
#gcs-conv h3{margin:0;font-size:1.6em;font-weight:700;letter-spacing:-.01em;color:var(--text)}

#gcs-conv .ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

#gcs-conv .seg{display:inline-flex;border:1.5px solid var(--cardBorder);border-radius:999px;padding:3px;background:var(--badgeBg)}
#gcs-conv .seg button{font-family:"Space Mono",monospace;font-size:.8em;font-weight:700;border:0;background:transparent;color:var(--secondary);padding:7px 12px;border-radius:999px;cursor:pointer;min-height:36px}
#gcs-conv .seg button[aria-pressed="true"]{background:var(--text);color:var(--pageBg)}
#gcs-conv .icon-btn{width:40px;height:40px;border-radius:999px;border:1.5px solid var(--iconBorder);background:var(--iconBg);color:var(--iconColor);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:"DM Sans",system-ui,sans-serif;font-weight:600;line-height:1}
#gcs-conv button:focus-visible,#gcs-conv input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#gcs-conv .card{background:var(--cardBg);border:1px solid var(--cardBorder);border-radius:14px;padding:16px;min-width:0}
#gcs-conv h4{margin:0 0 2px;font-size:1.08em;font-weight:700;color:var(--text)}
#gcs-conv .hint{margin:0 0 12px;font-size:.86em;color:var(--secondary)}
#gcs-conv .inrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
#gcs-conv input[type=text]{flex:1 1 140px;min-width:0;font-family:"Space Mono",monospace;font-size:1.25em;padding:10px 12px;border-radius:10px;border:1.5px solid var(--cardBorder);background:var(--pageBg);color:var(--text)}
#gcs-conv input[type=text].bad{border-color:#DC2626}
#gcs-conv .msg{font-size:.86em;color:var(--secondary);min-height:1.3em;margin:0 0 8px}
#gcs-conv .msg.bad{color:#B42318}
#gcs-conv[data-theme="dark"] .msg.bad{color:#F28B8B}
/* result */
#gcs-conv .res{display:flex;gap:14px;align-items:center;background:var(--badgeBg);border-radius:12px;padding:12px;min-height:6.2em}
/* the box keeps the same size whatever is inside it: size is set here, text size on the inner span */
#gcs-conv .tile{flex:0 0 auto;width:6.2em;height:6.2em;border-radius:12px;background:var(--cardBg);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;text-align:center;font-size:1em;color:var(--ch);overflow:hidden}
#gcs-conv .tile .glyph{font-family:"Space Mono",monospace;font-weight:700;font-size:2.6em;line-height:1}
#gcs-conv .tile.ctrl{padding:6px;color:var(--text)}
#gcs-conv .tile.ctrl .glyph{font-family:"DM Sans",system-ui,sans-serif;font-size:.86em;font-weight:700;line-height:1.2}
#gcs-conv .tile.empty{border-style:dashed;border-color:var(--cardBorder);color:var(--secondary)}
#gcs-conv .tile.empty .glyph{font-family:"DM Sans",system-ui,sans-serif;font-size:1.6em}
#gcs-conv .facts{min-width:0;flex:1}
#gcs-conv .facts .row{display:flex;gap:8px;align-items:baseline;font-family:"Space Mono",monospace;font-size:.95em;flex-wrap:wrap}
#gcs-conv .facts .k{font-family:"DM Sans",system-ui,sans-serif;font-size:.78em;font-weight:700;color:var(--secondary);width:4.6em;flex:0 0 auto}
#gcs-conv .dn{color:var(--dn)} #gcs-conv .hx{color:var(--hx)} #gcs-conv .bn{color:var(--bn)}
#gcs-conv .cname{font-size:.86em;color:var(--secondary);margin-top:4px}
#gcs-conv .cname b{color:var(--text)}
#gcs-conv .tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:.8em;font-weight:600;white-space:nowrap}
#gcs-conv .tag.now{background:var(--correctBg);color:var(--correctText)}
#gcs-conv .tag.old{background:var(--cardBg);color:var(--badgeText)}
/* answer boxes: denary and character, side by side, always the same size */
#gcs-conv .inlabel{flex:0 0 100%;font-size:.78em;font-weight:700;color:var(--secondary);text-transform:uppercase;letter-spacing:.05em}
#gcs-conv .boxes{display:flex;gap:12px;align-items:stretch;justify-content:center;flex-wrap:wrap}
#gcs-conv .obox{display:flex;flex-direction:column;align-items:center;gap:6px}
#gcs-conv .olabel{font-size:.78em;font-weight:700;color:var(--secondary);text-transform:uppercase;letter-spacing:.05em}
#gcs-conv .num{width:6.2em;height:6.2em;border-radius:12px;background:var(--cardBg);border:2px solid var(--dn);display:flex;align-items:center;justify-content:center;font-family:"Space Mono",monospace;font-weight:700;color:var(--dn);overflow:hidden}
#gcs-conv .num .glyph{font-size:2.1em;line-height:1}
#gcs-conv .num.empty{border-style:dashed;border-color:var(--cardBorder);color:var(--secondary)}
#gcs-conv .num.empty .glyph{font-family:"DM Sans",system-ui,sans-serif;font-size:1.6em}
#gcs-conv .eqrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:12px 14px;margin:6px 0 4px}
#gcs-conv .grp{display:flex;align-items:flex-end;gap:10px}
#gcs-conv .sym{font-family:"Space Mono",monospace;font-weight:700;font-size:1.6em;line-height:1;color:var(--secondary);padding-bottom:1.25em}
/* the binary input is the same height as the two answer boxes and just wide enough for 8 bits */
#gcs-conv input.bin{flex:none;width:calc(9ch + 1.6em);height:4.28em;font-size:1.45em;padding:0 .5em;text-align:center}
#gcs-conv input.bin::placeholder,#gcs-conv input.chr::placeholder{color:var(--secondary);opacity:.45}
/* the character box is typeable: a borderless input fills it; control-code names sit on top when there's nothing to type */
#gcs-conv .charbox{position:relative;padding:0}
#gcs-conv .charbox:focus-within{outline:3px solid var(--accent);outline-offset:2px}
#gcs-conv input.chr{width:100%;height:100%;border:0;margin:0;padding:0;background:transparent;text-align:center;font-family:"Space Mono",monospace;font-weight:700;font-size:2.6em;color:var(--ch);border-radius:10px}
#gcs-conv input.chr:focus,#gcs-conv input.chr:focus-visible{outline:none}
#gcs-conv .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;pointer-events:none;font-family:"DM Sans",system-ui,sans-serif;font-weight:700;font-size:.86em;line-height:1.2;color:var(--text)}
#gcs-conv .res{flex-direction:column;align-items:stretch}
#gcs-conv .cname{text-align:center;margin-top:8px}
#gcs-conv .msg{text-align:center}
/* place values */
#gcs-conv .pv{margin-top:12px}
#gcs-conv .pv table{border-collapse:separate;border-spacing:4px 4px;margin:0 auto}
#gcs-conv .pv th{font-family:"Space Mono",monospace;font-size:.72em;font-weight:700;color:var(--secondary);text-align:center;padding:0 2px}
#gcs-conv .pv td{width:2.3em;height:2.3em;text-align:center;font-family:"Space Mono",monospace;font-weight:700;font-size:1.05em;border-radius:8px;border:1.5px solid var(--cardBorder);color:var(--secondary);background:var(--cardBg)}
#gcs-conv .pv td.on{background:var(--correctBg);border-color:var(--correctText);color:var(--correctText)}
#gcs-conv .pv td.gap{border:0;background:transparent;width:.4em}
#gcs-conv .sum{text-align:center;font-family:"Space Mono",monospace;font-size:.9em;color:var(--text);margin-top:6px;overflow-wrap:anywhere}
#gcs-conv .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:600px){#gcs-conv{padding:14px 12px;border-radius:14px}#gcs-conv .card{padding:14px 12px}}
@media (max-width:420px){#gcs-conv[data-fontsize="larger"]{font-size:17px}#gcs-conv[data-fontsize="largest"]{font-size:18px}}
@container (max-width:420px){#gcs-conv .lbl{display:none}#gcs-conv .head .seg button{padding:7px 10px}}
@container (max-width:340px){#gcs-conv input.bin{height:3.45em}#gcs-conv input.chr{font-size:2.2em}#gcs-conv .eqrow{gap:10px 10px}#gcs-conv .grp{gap:8px}#gcs-conv .num{width:5em;height:5em}#gcs-conv .num .glyph{font-size:1.8em}#gcs-conv .pv td{width:1.9em;height:2.1em;font-size:.95em}#gcs-conv .pv table{border-spacing:3px 3px}#gcs-conv .tile{width:5em;height:5em}#gcs-conv .tile .glyph{font-size:2.2em}#gcs-conv .tile.ctrl .glyph{font-size:.78em}}
</style>

<div id="gcs-conv" data-theme="light" data-fontsize="normal">
  <div class="head">
    <div>
      <h3>ASCII converter</h3>
      <p class="sub">Type a binary number or a character to see the other two.</p>
    </div>
    <div class="ctrls">
      <span class="lbl">Binary:</span>
      <span class="seg" role="group" aria-label="Number of bits shown in binary">
        <button type="button" data-bits="7" aria-pressed="true">7 bits</button>
        <button type="button" data-bits="8" aria-pressed="false">8 bits</button>
      </span>
      <button type="button" class="icon-btn" data-act="fontsize" aria-label="Change text size"><span style="font-size:10px">A</span><span style="font-size:15px;margin-left:1px">A</span></button>
      <button type="button" class="icon-btn" data-act="theme" aria-label="Change colour theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"></path></svg></button>
    </div>
  </div>

  <section class="card" aria-labelledby="gcs-conv-h1">
      <h4 id="gcs-conv-h1">Binary, denary and character</h4>
      <p class="hint">Type a binary number (up to 8 bits) in the Binary box, or type a character in the Character box.</p>
      <div class="eqrow">
        <div class="grp">
          <div class="obox"><label class="olabel" for="gcs-conv-in">Binary</label>
            <input type="text" id="gcs-conv-in" class="bin" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="numeric" maxlength="9" placeholder="100 0001"></div>
          <span class="sym" aria-hidden="true">=</span>
          <div class="obox"><span class="olabel">Denary</span><div class="num empty" id="gcs-conv-dn" aria-hidden="true"><span class="glyph">?</span></div></div>
        </div>
        <div class="grp">
          <span class="sym" aria-hidden="true">&harr;</span>
          <div class="obox"><label class="olabel" for="gcs-conv-chr">Character</label>
            <div class="tile charbox empty" id="gcs-conv-ch"><input type="text" id="gcs-conv-chr" class="chr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="A" aria-describedby="gcs-conv-say"><span class="ov" id="gcs-conv-ov" aria-hidden="true"></span></div></div>
        </div>
      </div>
      <p class="msg" id="gcs-conv-msg" aria-live="polite"></p>
      <p class="sr" id="gcs-conv-say" aria-live="polite"></p>
      <div id="gcs-conv-extra"></div>
    </section>

</div>

<script>
(function(){
  var root=document.getElementById('gcs-conv'); if(!root) return;
  // Control codes 0-31 and 127: same names and notes as the gcsecs.com ASCII table
  var CTRL={"0": ["Null", "nothing; used to mark the end of some text", true], "1": ["Start of heading", "marked the start of a message’s heading", false], "2": ["Start of text", "marked where a message’s text began", false], "3": ["End of text", "marked where a message’s text ended", false], "4": ["End of transmission", "meant “message finished”", false], "5": ["Enquiry", "asked another machine “are you there?”", false], "6": ["Acknowledge", "replied “yes, received OK”", false], "7": ["Bell", "made the computer beep (old teleprinters rang a real bell)", true], "8": ["Backspace", "the Backspace key: moves back one character", true], "9": ["Horizontal tab", "the Tab key", true], "10": ["Line feed", "moves down to a new line", true], "11": ["Vertical tab", "moves down several lines", false], "12": ["Form feed", "told a printer to start a new page", false], "13": ["Carriage return", "moves back to the start of the line (the Enter key)", true], "14": ["Shift out", "switched to a different set of characters", false], "15": ["Shift in", "switched back to the normal characters", false], "16": ["Data link escape", "controlled a data connection between machines", false], "17": ["Device control 1", "told a device to carry on sending", false], "18": ["Device control 2", "controlled a device such as a printer", false], "19": ["Device control 3", "told a device to pause sending", false], "20": ["Device control 4", "controlled a device such as a printer", false], "21": ["Negative acknowledge", "replied “error, please send again”", false], "22": ["Synchronous idle", "kept a connection in step while no data was sent", false], "23": ["End of transmission block", "marked the end of a block of data", false], "24": ["Cancel", "meant “ignore the data just sent”", false], "25": ["End of medium", "reached the end of a tape or disk", false], "26": ["Substitute", "replaced a character that arrived damaged", false], "27": ["Escape", "the Esc key", true], "28": ["File separator", "split data into sections (largest)", false], "29": ["Group separator", "split data into sections", false], "30": ["Record separator", "split data into sections", false], "31": ["Unit separator", "split data into sections (smallest)", false], "127": ["Delete", "the Delete key", true]};
  var THEMES=['light','dark','accessible','ocean','forest','plum'];
  var NAMES={light:'Light',dark:'Dark',accessible:'Accessibility',ocean:'Ocean',forest:'Forest',plum:'Plum'};
  var SIZES=['normal','larger','largest'];
  function get(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
  function put(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  var theme=get('mcq_theme','light'), size=get('mcq_fontsize','normal');
  if(THEMES.indexOf(theme)<0) theme='light';
  if(SIZES.indexOf(size)<0) size='normal';
  var bits=7, typedBits=0, lastCode=null;
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function pad(s,n){while(s.length<n)s='0'+s;return s;}
  function binStr(n){var b=pad(n.toString(2),bits);return bits===8?b.slice(0,4)+' '+b.slice(4):b.slice(0,3)+' '+b.slice(3);}
  

  function tileHtml(n){
    if(n===32) return '<div class="tile ctrl" aria-hidden="true"><span class="glyph">Space</span></div>';
    if(CTRL[n]) return '<div class="tile ctrl" aria-hidden="true"><span class="glyph">'+esc(CTRL[n][0])+'</span></div>';
    return '<div class="tile" aria-hidden="true"><span class="glyph">'+esc(String.fromCharCode(n))+'</span></div>';
  }
  function charLabel(n){
    if(n===32) return 'a space';
    if(CTRL[n]) return 'the control code “'+CTRL[n][0]+'”';
    return 'the character “'+String.fromCharCode(n)+'”';
  }
  function placeValues(n){
    var pvs=[],h='',b='',parts=[],i,v;
    var nb=Math.max(bits,typedBits);
    for(i=nb-1;i>=0;i--) pvs.push(Math.pow(2,i));
    for(i=0;i<pvs.length;i++){
      v=(n & pvs[i])?1:0;
      h+='<th scope="col">'+pvs[i]+'</th>';
      b+='<td class="'+(v?'on':'')+'">'+v+'</td>';
      if(v) parts.push(pvs[i]);
      // small gap between the groups, matching the spaced binary
      if((nb===8&&i===3)||(nb===7&&i===2)){h+='<th></th>';b+='<td class="gap"></td>';}
    }
    var sum=parts.length?parts.join(' + ')+' = '+n:'No bits are on, so the value is 0';
    return '<div class="pv"><table aria-label="Place values"><thead><tr>'+h+'</tr></thead><tbody><tr>'+b+'</tr></tbody></table><div class="sum">'+sum+'</div></div>';
  }
  var dnBox=$('gcs-conv-dn'), chBox=$('gcs-conv-ch'), chr=$('gcs-conv-chr'), ov=$('gcs-conv-ov'), extra=$('gcs-conv-extra'), say=$('gcs-conv-say');
  var input=$('gcs-conv-in'), msg=$('gcs-conv-msg');
  var lastSource='bin';
  // put a space before the last four bits: 1000001 -> 100 0001, 01000001 -> 0100 0001
  function fmtBin(d){ return d.length>4 ? d.slice(0,d.length-4)+' '+d.slice(d.length-4) : d; }
  function setMsg(t){ msg.className=t?'msg bad':'msg'; msg.textContent=t||''; }

  function show(n){
    dnBox.className='num'; dnBox.innerHTML='<span class="glyph">'+n+'</span>';
    var printable=n>32&&n<127;
    if(lastSource!=='chr') chr.value=printable?String.fromCharCode(n):'';
    ov.textContent=n===32?'Space':((chr.value==='')?(CTRL[n]?CTRL[n][0]:''):'');
    chBox.className='tile charbox'+(printable?'':' ctrl');
    var name='';
    if(CTRL[n]) name='<div class="cname"><b>'+esc(CTRL[n][0])+'</b> \u2013 '+esc(CTRL[n][1])+'<span class="tag '+(CTRL[n][2]?'now">Still used':'old">Rarely used today')+'</span></div>';
    else if(n===32) name='<div class="cname"><b>Space</b> \u2013 the spacebar</div>';
    extra.innerHTML=name+placeValues(n);
    say.textContent='Binary '+binStr(n)+' is '+n+' in denary, which is '+charLabel(n)+'.';
  }
  function clearBoxes(text,keep){
    dnBox.className='num empty'; dnBox.innerHTML='<span class="glyph">?</span>';
    if(keep!=='chr') chr.value='';
    if(keep!=='bin') input.value='';
    ov.textContent=''; chBox.className='tile charbox empty';
    extra.innerHTML=text?'<p class="hint" style="margin:8px 0 0;text-align:center">'+text+'</p>':'';
    say.textContent='';
  }

  /* ---- typing in the Binary box ---- */
  function readCode(){
    var raw=input.value.replace(/\s+/g,''), n;
    lastSource='bin'; setMsg(''); input.className='bin';
    if(raw===''){lastCode=null;clearBoxes('Type in the Binary box or the Character box.','bin');return;}
    if(!/^[01]+$/.test(raw)) return bad('Binary only uses 0s and 1s.');
    if(raw.length>8) return bad('ASCII codes use 7 or 8 bits. That\u2019s '+raw.length+' bits.');
    n=parseInt(raw,2); typedBits=raw.length;
    if(n>127) return bad(raw+' is '+n+' in denary, which is too big. ASCII codes go from 0 to 127.');
    lastCode=n; show(n);
  }
  function bad(t){setMsg(t);input.className='bin bad';lastCode=null;clearBoxes('','bin');}
  input.addEventListener('input',function(){
    // tidy the spacing as the pupil types, keeping the cursor in the same place
    var v=input.value, pos=input.selectionStart==null?v.length:input.selectionStart;
    var digitsBefore=v.slice(0,pos).replace(/\s+/g,'').length, d=v.replace(/\s+/g,'');
    if(/^[01]*$/.test(d) && d.length<=8){
      var f=fmtBin(d); if(f!==v){ input.value=f;
        var p=0,seen=0; while(p<f.length&&seen<digitsBefore){ if(f.charAt(p)!==' ') seen++; p++; }
        try{input.setSelectionRange(p,p);}catch(e){} }
    }
    readCode();
  });

  /* ---- typing in the Character box ---- */
  // select the character whenever the box is clicked or focused, so the next key typed replaces it
  function selAll(){ setTimeout(function(){ try{chr.select();}catch(e){} },0); }
  chr.addEventListener('focus',selAll);
  chr.addEventListener('mouseup',function(e){ e.preventDefault(); try{chr.select();}catch(err){} });
  chr.addEventListener('input',function(){
    var v=chr.value; lastSource='chr'; setMsg(''); input.className='bin';
    if(v===''){lastCode=null;clearBoxes('Type in the Binary box or the Character box.','chr');return;}
    if(v.length>1){ var c=chr.selectionStart; v=(c&&c<=v.length)?v.charAt(c-1):v.charAt(v.length-1); chr.value=v; }   // keep only the character just typed
    var n=v.charCodeAt(0);
    if(n>127){ setMsg('\u201c'+v+'\u201d isn\u2019t in ASCII. ASCII only has codes 0 to 127.'); lastCode=null; clearBoxes('','chr'); return; }
    typedBits=0; lastCode=n;
    input.value=fmtBin(pad(n.toString(2),bits));
    show(n);
  });

  function redraw(){
    if(lastCode!==null){ if(lastSource==='chr') input.value=fmtBin(pad(lastCode.toString(2),bits)); show(lastCode); }
    else if(lastSource==='bin') readCode();
  }
  root.querySelectorAll('[data-bits]').forEach(function(btn){
    btn.addEventListener('click',function(){
      bits=+btn.getAttribute('data-bits');
      root.querySelectorAll('[data-bits]').forEach(function(b){b.setAttribute('aria-pressed',b===btn?'true':'false');});
      redraw();
    });
  });
  function apply(){
    root.setAttribute('data-theme',theme); root.setAttribute('data-fontsize',size);
    root.querySelector('[data-act="theme"]').setAttribute('aria-label','Change colour theme (currently '+NAMES[theme]+')');
    root.querySelector('[data-act="fontsize"]').setAttribute('aria-label','Change text size (currently '+size+')');
  }
  root.querySelector('[data-act="theme"]').addEventListener('click',function(){theme=THEMES[(THEMES.indexOf(theme)+1)%THEMES.length];put('mcq_theme',theme);apply();});
  root.querySelector('[data-act="fontsize"]').addEventListener('click',function(){size=SIZES[(SIZES.indexOf(size)+1)%SIZES.length];put('mcq_fontsize',size);apply();});
  apply(); redraw();
})();
</script>
